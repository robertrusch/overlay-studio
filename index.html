/* After an earlier UkToOhio composition (UkToOhio.tsx): the camera zooms out, flies and
   zooms in on a second place (van Wijk & Nuij's smooth zoom-and-pan, the maths behind MapLibre's
   flyTo), and a pin drops on each place. The satellite tiles and clouds are replaced by the website's
   own world map (Plinth assets/maps/world-detail.svg, Web Mercator in a 10000-unit square), drawn on
   a canvas every frame so the coastline stays sharp at any zoom. */

const PLACES = {
  "Northampton, UK": [52.2405, -0.8901],
  "Dordrecht, NL": [51.8133, 4.6901],
  "Alblasserdam, NL": [51.8656, 4.6611],
  "Venlo, NL": [51.3704, 6.1724],
  "Gorzów, PL": [52.7368, 15.2288],
  "Mechelen, BE": [51.0259, 4.4776],
  "Ostend, BE": [51.2154, 2.9286],
  "Columbus, US": [39.9612, -82.9988],
  "Las Vegas, US": [36.1699, -115.1398],
  "Toronto, CA": [43.6532, -79.3832],
  "Brisbane, AU": [-27.4698, 153.0251],
  "London, UK": [51.5072, -0.1276],
  "Amsterdam, NL": [52.3676, 4.9041],
  "Rotterdam, NL": [51.9244, 4.4777],
  "Brussels, BE": [50.8503, 4.3517],
  "Berlin, DE": [52.52, 13.405],
  "Paris, FR": [48.8566, 2.3522],
  "Dublin, IE": [53.3498, -6.2603],
  "Madrid, ES": [40.4168, -3.7038],
  "Milan, IT": [45.4642, 9.19],
  "New York, US": [40.7128, -74.006],
  "Sydney, AU": [-33.8688, 151.2093],
};
const PLACE_OPTIONS = [...Object.keys(PLACES).map((k) => [k, k]), ["custom", "Somewhere else…"]];

const MAP_WORLD = 10000;
const merc = (lat, lng) => {
  const s = Math.sin((clamp(lat, -85, 85) * Math.PI) / 180);
  return { x: ((lng + 180) / 360) * MAP_WORLD, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * MAP_WORLD };
};
/* Pixels per map unit at a MapLibre-style zoom (a 512 px world at zoom 0), so the original's zoom values carry over. */
const pxPerUnit = (zoom) => (512 * 2 ** zoom) / MAP_WORLD;

function placeOf(s, which) {
  const key = s[which + "Place"];
  const custom = key === "custom" || !PLACES[key];
  const [lat, lng] = custom ? [Number(s[which + "Lat"]) || 0, Number(s[which + "Lng"]) || 0] : PLACES[key];
  const label = String(s[which + "Label"] || "").trim() || (custom ? "" : key.split(",")[0]);
  return { lat, lng, label };
}

function makeFlight(screenW, A, B, z0, z1, rho) {
  const c0 = merc(A.lat, A.lng), c1 = merc(B.lat, B.lng);
  const w0 = screenW / pxPerUnit(z0), w1 = screenW / pxPerUnit(z1);
  const u1 = Math.hypot(c1.x - c0.x, c1.y - c0.y);
  if (u1 < 1e-6) return (p) => ({ cx: c0.x, cy: c0.y, zoom: z0 + (z1 - z0) * p, k: p });
  const rho2 = rho * rho;
  const b = (i) => (w1 * w1 - w0 * w0 + (i === 0 ? 1 : -1) * rho2 * rho2 * u1 * u1) / (2 * (i === 0 ? w0 : w1) * rho2 * u1);
  const r = (i) => Math.log(Math.sqrt(b(i) * b(i) + 1) - b(i));
  const r0 = r(0), S = (r(1) - r0) / rho;
  return (p) => {
    const sv = clamp(p, 0, 1) * S;
    const uu = (w0 / rho2) * (Math.cosh(r0) * Math.tanh(rho * sv + r0) - Math.sinh(r0));
    const k = uu / u1;
    return { cx: c0.x + (c1.x - c0.x) * k, cy: c0.y + (c1.y - c0.y) * k, zoom: z0 + Math.log2(Math.cosh(rho * sv + r0) / Math.cosh(r0)), k };
  };
}

/* The map file is published next to the page and loaded once. */
const MAP_URL = "maps/world-detail.svg";
let mapPromise = null, mapData = null;
function loadWorldMap() {
  if (!mapPromise) {
    mapPromise = fetch(MAP_URL)
      .then((r) => { if (!r.ok) throw new Error("world map " + r.status); return r.text(); })
      .then((txt) => {
        const land = new Path2D();
        for (const m of txt.matchAll(/\sd="([^"]+)"/g)) land.addPath(new Path2D(m[1]));
        mapData = { land };
        return mapData;
      });
    mapPromise.catch(() => { mapPromise = null; });
  }
  return mapPromise;
}
function useWorldMap() {
  /* useDelayRender scopes the wait to this render, which the in-browser exporter needs (a global delayRender isn't waited for). */
  const { delayRender, continueRender } = useDelayRender();
  const [data, setData] = useState(mapData);
  const [handle] = useState(() => (mapData ? null : delayRender("Loading the world map")));
  useEffect(() => {
    if (data) return;
    let alive = true;
    loadWorldMap()
      .then((d) => { if (alive) setData(d); })
      .catch((e) => { console.error(e); if (handle !== null) continueRender(handle); });
    return () => { alive = false; };
  }, []);
  /* Let the frame be captured only once the map has been drawn: effects run after the canvas's layout effect. */
  useEffect(() => { if (data && handle !== null) continueRender(handle); }, [data]);
  return data;
}

function flightPlan(s) {
  const flightStart = Math.round((Number(s.wait) || 0) * FPS);
  const flightF = Math.max(5, Math.round((Number(s.flightDuration) || 3) * FPS));
  const pin1Start = Math.round(0.15 * FPS);
  const pin2Start = Math.max(pin1Start, flightStart + flightF - Math.round(0.25 * FPS));
  const inF = pin2Start + Math.round(0.65 * FPS);
  return { flightStart, flightF, pin1Start, pin2Start, inF };
}

const FLIGHT_EASE = Easing.bezier(0.45, 0, 0.55, 1);
const PIN_PATH = "M24 2C12.4 2 3 11.4 3 23c0 15.2 18.2 36.4 19.6 38a1.9 1.9 0 0 0 2.8 0C26.8 59.4 45 38.2 45 23 45 11.4 35.6 2 24 2Z";
const pinSrc = (color) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64"><path d="${PIN_PATH}" fill="${color}" stroke="#ffffff" stroke-width="2.5"/><circle cx="24" cy="23" r="8.5" fill="#ffffff"/></svg>`);

function MapPin({ x, y, start, f, s, u, label }) {
  if (f < start) return null;
  const size = 84 * u * (s.pinSize / 100), ph = (size * 4) / 3;
  const drop = spring({ fps: FPS, frame: f - start, config: { damping: 11 }, durationInFrames: Math.round(0.6 * FPS) });
  const fadeIn = interpolate(f, [start, start + 0.12 * FPS], [0, 1], { extrapolateLeft: "clamp", extrapolateRight: "clamp" });
  const lp = prog(f, start + Math.round(0.25 * FPS), Math.round(0.4 * FPS));
  const lo = interpolate(f, [start + 0.25 * FPS, start + 0.55 * FPS], [0, 1], { extrapolateLeft: "clamp", extrapolateRight: "clamp" });
  return html`<div style=${{ position: "absolute", left: x, top: y }}>
    <div style=${{ position: "absolute", left: -size * 0.35, top: -size * 0.12, width: size * 0.7, height: size * 0.24, borderRadius: "50%", background: "rgba(0, 0, 0, 0.3)", transform: `scale(${Math.max(0, drop)})` }}></div>
    <${Img} src=${pinSrc(hex(s.pinColor))} style=${{ position: "absolute", left: -size / 2, top: -ph, width: size, height: ph, opacity: fadeIn, transformOrigin: "50% 100%", transform: `translateY(${(1 - drop) * -160 * u}px) scale(${0.4 + 0.6 * drop})` }} />
    ${label && html`<div style=${{ position: "absolute", left: 0, top: 18 * u, transform: `translate(-50%, ${(1 - lp) * 16 * u}px)`, opacity: lo, whiteSpace: "nowrap",
      fontFamily: s.labelFont === "serif" ? FONT.serif : FONT.sans, fontWeight: s.labelFont === "serif" ? 500 : 700, fontSize: s.labelSize * u, lineHeight: 1.2, color: hex(s.labelColor) }}>${label}</div>`}
  </div>`;
}

function MapCanvas({ w, h, u, cam, data, s, A, B }) {
  const ref = useRef(null);
  useLayoutEffect(() => {
    const c = ref.current;
    if (!c) return;
    const x = c.getContext("2d");
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.clearRect(0, 0, w, h);
    if (s.seaOn) { x.fillStyle = hex(s.seaColor); x.fillRect(0, 0, w, h); }
    if (!data) return;
    const k = pxPerUnit(cam.zoom);
    x.setTransform(k, 0, 0, k, w / 2 - cam.cx * k, h / 2 - cam.cy * k);
    x.globalAlpha = s.landStrength / 100;
    x.fillStyle = hex(s.landColor);
    x.fill(data.land);
    x.globalAlpha = 1;
    if (s.borders && s.seaOn) {
      x.strokeStyle = hex(s.seaColor);
      x.lineWidth = (1.2 * u) / k;
      x.lineJoin = "round";
      x.stroke(data.land);
    }
    if (s.route && cam.k > 0) {
      /* A dashed arc bowing north from A to B, drawn as far as the camera has travelled. */
      const p0 = merc(A.lat, A.lng), p2 = merc(B.lat, B.lng);
      const dx = p2.x - p0.x, dy = p2.y - p0.y, len = Math.hypot(dx, dy) || 1;
      let nx = -dy / len, ny = dx / len;
      if (ny > 0) { nx = -nx; ny = -ny; }
      const p1 = { x: (p0.x + p2.x) / 2 + nx * len * 0.18, y: (p0.y + p2.y) / 2 + ny * len * 0.18 };
      const end = clamp(cam.k, 0, 1), steps = 80;
      x.beginPath();
      for (let i = 0; i <= steps; i++) {
        const t = (end * i) / steps, a = (1 - t) * (1 - t), bb = 2 * (1 - t) * t, cc = t * t;
        const px = a * p0.x + bb * p1.x + cc * p2.x, py = a * p0.y + bb * p1.y + cc * p2.y;
        if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
      }
      x.strokeStyle = hex(s.pinColor);
      x.lineWidth = (4 * u) / k;
      x.lineCap = "round";
      x.setLineDash([(14 * u) / k, (12 * u) / k]);
      x.stroke();
      x.setLineDash([]);
    }
  });
  return html`<canvas ref=${ref} width=${w} height=${h} style=${{ position: "absolute", left: 0, top: 0, width: w, height: h }}></canvas>`;
}

function FlightTemplate({ s, f, w, h, t }) {
  const data = useWorldMap();
  const P = flightPlan(s);
  const u = Math.min(w, h) / 1080;
  const A = placeOf(s, "from"), B = placeOf(s, "to");
  const fly = useMemo(() => makeFlight(w, A, B, Number(s.fromZoom), Number(s.toZoom), Number(s.curve)),
    [w, A.lat, A.lng, B.lat, B.lng, s.fromZoom, s.toZoom, s.curve]);
  const cam = fly(prog(f, P.flightStart, P.flightF, FLIGHT_EASE));
  const k = pxPerUnit(cam.zoom);
  const screen = (p) => ({ x: w / 2 + (p.x - cam.cx) * k, y: h / 2 + (p.y - cam.cy) * k });
  const pa = screen(merc(A.lat, A.lng)), pb = screen(merc(B.lat, B.lng));
  const o = exitAt(s, f, t, 0);
  return html`<${AbsoluteFill} style=${{ opacity: 1 - o, overflow: "hidden" }}>
    <${MapCanvas} w=${w} h=${h} u=${u} cam=${cam} data=${data} s=${s} A=${A} B=${B} />
    <${MapPin} x=${pa.x} y=${pa.y} start=${P.pin1Start} f=${f} s=${s} u=${u} label=${A.label} />
    <${MapPin} x=${pb.x} y=${pb.y} start=${P.pin2Start} f=${f} s=${s} u=${u} label=${B.label} />
  </${AbsoluteFill}>`;
}

/* ------------------------------------------------------- template: process steps */
/* Steps joined by a line that travels from node to node, pausing at each: the node pops in as the
   line reaches it, then its label rises. Runs across in 16:9 and down in 9:16 unless set. */

const parseSteps = (text) => String(text || "").split("\n").map((x) => x.trim()).filter(Boolean).slice(0, 6)
  .map((line) => { const [label, ...rest] = line.split("|"); return { label: label.trim(), detail: rest.join("|").trim() }; });
const stepsOrient = (s, w, h) => (s.orientation === "auto" ? ((w !== undefined ? w >= h : s.ratio !== "9:16") ? "row" : "column") : s.orientation);
const SEG_EASE = Easing.bezier(0.65, 0, 0.35, 1);

function stepsPlan(s, M) {
  const steps = parseSteps(s.steps);
  const headOn = s.headingOn && String(s.heading || "").trim();
  const t0 = headOn ? M.lead * 2 : 0;
  const gap = Math.max(4, Math.round(M.enter * 1.1));
  const arrive = steps.map((_, i) => t0 + i * gap);
  const anyDetail = steps.some((st) => st.detail);
  const detailDelay = Math.round(M.stagger * 2);
  const last = arrive.length ? arrive[arrive.length - 1] : t0;
  const inF = Math.max(headOn ? M.enter : 0, steps.length ? last + 3 + M.enter + (anyDetail ? detailDelay : 0) : 0, 1);
  return { steps, headOn, t0, gap, arrive, anyDetail, detailDelay, inF };
}

function StepNode({ i, kind, d, colorId, p, ringColor, ringOpacity }) {
  const fill = hex(colorId);
  const ink = LIGHT_SWATCHES.includes(colorId) ? "#1a2e1e" : "#ffffff";
  const stroke = Math.max(2, d * 0.1);
  let inner;
  if (kind === "dot") {
    inner = html`<span style=${{ position: "absolute", left: d * 0.25, top: d * 0.25, width: d * 0.5, height: d * 0.5, borderRadius: "50%", background: fill, transform: `scale(${p})` }}></span>`;
  } else {
    const content = kind === "tick"
      ? html`<span style=${{ position: "absolute", left: d * 0.37, top: d * 0.19, width: d * 0.24, height: d * 0.46, borderRight: `${stroke}px solid ${ink}`, borderBottom: `${stroke}px solid ${ink}`, transform: "rotate(45deg)" }}></span>`
      : html`<span style=${{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FONT.sans, fontWeight: 700, fontSize: d * 0.44, lineHeight: 1, color: ink }}>${i + 1}</span>`;
    inner = html`<span style=${{ position: "absolute", inset: 0, borderRadius: "50%", background: fill, transform: `scale(${p})` }}>${content}</span>`;
  }
  return html`<span style=${{ position: "relative", display: "block", flex: "none", width: d, height: d }}>
    ${ringOpacity > 0 && html`<span style=${{ position: "absolute", inset: 0, borderRadius: "50%", border: `${Math.max(2, d * 0.05)}px solid ${ringColor}`, opacity: ringOpacity }}></span>`}
    ${inner}
  </span>`;
}

function StepsTemplate({ s, f, w, h, t }) {
  const M = t.M, P = stepsPlan(s, M);
  const n = P.steps.length;
  const u = Math.min(w, h) / 1080, fs = s.size * u, hx = s.position[1];
  const padX = (w * s.margin) / 100;
  const orient = stepsOrient(s, w, h);
  const d = fs * 1.3;
  const lineW = Math.max(2 * u, fs * 0.07);
  const o = exitAt(s, f, t, 0), oT = exitAt(s, f, t, 1);
  const trackIn = prog(f, 0, Math.round(M.enter * 0.6));
  const trackOpacity = s.track ? 0.28 * trackIn * (1 - o) : 0;
  const lineColor = hex(s.nodeColor), trackColor = hex(s.trackColor);
  let along = 0;
  for (let j = 0; j < n - 1; j++) along += prog(f, P.arrive[j], P.gap, SEG_EASE);
  const frac = n > 1 ? along / (n - 1) : 0;
  const serif = s.labelFont === "serif";
  const labelStyle = { fontFamily: serif ? FONT.serif : FONT.sans, fontWeight: 500, fontSize: fs, lineHeight: 1.25, color: hex(s.labelColor) };
  const detailStyle = { fontFamily: FONT.sans, fontWeight: 400, fontSize: fs * 0.62, lineHeight: 1.35, color: hex(s.labelColor), marginTop: fs * 0.18 };

  const stepParts = (st, i) => {
    const pop = n ? spring({ fps: FPS, frame: f - P.arrive[i], config: { damping: 12 }, durationInFrames: Math.round(M.enter * 0.8) }) : 0;
    const pl = prog(f, P.arrive[i] + 3, M.enter);
    const pd = prog(f, P.arrive[i] + 3 + P.detailDelay, M.enter);
    const node = html`<${StepNode} i=${i} kind=${s.node} d=${d} colorId=${s.nodeColor} p=${Math.max(0, pop) * (1 - o)} ringColor=${trackColor} ringOpacity=${trackOpacity} />`;
    const text = html`<${Rise} p=${pl} o=${oT} style=${labelStyle}>${st.label}</${Rise}>
      ${st.detail && html`<div style=${{ ...detailStyle, opacity: 0.8 * pd * (1 - oT), transform: `translateY(${(1 - pd) * 0.5 - oT * 0.3}em)` }}>${st.detail}</div>`}`;
    return { node, text };
  };

  let body;
  if (orient === "row") {
    const L = (w - 2 * padX) * (s.length / 100);
    const colW = n ? L / n : L;
    body = html`<div style=${{ position: "relative", width: L, display: "flex" }}>
      ${n > 1 && s.track && html`<div style=${{ position: "absolute", left: colW / 2, top: d / 2 - lineW / 2, width: L - colW, height: lineW, background: trackColor, opacity: trackOpacity }}></div>`}
      ${n > 1 && html`<div style=${{ position: "absolute", left: colW / 2, top: d / 2 - lineW / 2, width: L - colW, height: lineW, background: lineColor, transform: `scaleX(${frac})`, transformOrigin: "left center", opacity: 1 - o }}></div>`}
      ${P.steps.map((st, i) => { const { node, text } = stepParts(st, i);
        return html`<div key=${i} style=${{ flex: "1 1 0", minWidth: 0, display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center" }}>
          ${node}<div style=${{ marginTop: fs * 0.55, padding: "0 0.3em", maxWidth: "100%" }}>${text}</div></div>`; })}
    </div>`;
  } else {
    const rowH = d + fs * (P.anyDetail ? 1.5 : 0.8);
    body = html`<div style=${{ position: "relative", display: "flex", flexDirection: "column" }}>
      ${n > 1 && s.track && html`<div style=${{ position: "absolute", left: d / 2 - lineW / 2, top: d / 2, width: lineW, height: rowH * (n - 1), background: trackColor, opacity: trackOpacity }}></div>`}
      ${n > 1 && html`<div style=${{ position: "absolute", left: d / 2 - lineW / 2, top: d / 2, width: lineW, height: rowH * (n - 1), background: lineColor, transform: `scaleY(${frac})`, transformOrigin: "center top", opacity: 1 - o }}></div>`}
      ${P.steps.map((st, i) => { const { node, text } = stepParts(st, i);
        return html`<div key=${i} style=${{ height: i < n - 1 ? rowH : "auto", display: "flex", alignItems: "flex-start", gap: fs * 0.6 }}>
          ${node}<div style=${{ paddingTop: Math.max(0, (d - fs * 1.25) / 2), minWidth: 0, textAlign: "left" }}>${text}</div></div>`; })}
    </div>`;
  }

  return html`<${Frame} s=${s} w=${w} h=${h} pos=${s.position}>
    <div style=${{ display: "flex", flexDirection: "column", alignItems: ITEMS[hx], maxWidth: w - 2 * padX }}>
      ${P.headOn && html`<div style=${{ fontFamily: FONT.serif, fontWeight: 500, fontSize: fs * 1.6, lineHeight: 1.08, letterSpacing: "-0.015em", color: hex(s.headingColor), marginBottom: fs * 1.1, textAlign: ALIGN[hx], textWrap: "balance" }}>
        <${HighlightText} L=${planLines(s.heading, "words", 0, M)} entrance="words" f=${f} M=${M} o=${o} accentStyle=${accentStyleFor(s, "nodeColor")} />
      </div>`}
      ${body}
    </div>
  </${Frame}>`;
}

/* ---------------------------------------------------------- template: comparison */
/* Two values side by side. The left rises in, a separator appears, the right rises in, then the
   losing side dims and a line strikes through it. Side by side in 16:9, stacked in 9:16 unless set. */

const compareOrient = (s, w, h) => (s.orientation === "auto" ? ((w !== undefined ? w >= h : s.ratio !== "9:16") ? "row" : "column") : s.orientation);

function comparePlan(s, M) {
  const headOn = s.headingOn && String(s.heading || "").trim();
  const t0 = headOn ? M.lead * 2 : 0;
  const leftStart = t0;
  const sepStart = leftStart + Math.round(M.enter * 0.6);
  const rightStart = sepStart + Math.round(M.enter * 0.6);
  const countF = s.countUp ? Math.round(30 * M.k) : 0;
  const emphStart = rightStart + M.enter + countF;
  const emphOn = s.winner !== "none";
  const inF = Math.max(rightStart + 2 + M.enter + countF, emphOn ? emphStart + Math.round(M.enter * 0.9) : 0, 1);
  return { headOn, t0, leftStart, sepStart, rightStart, countF, emphStart, emphOn, inF };
}

function CompareSeparator({ kind, vertical, p, o, fs, u, s }) {
  const win = hex(s.winColor);
  if (kind === "none") return null;
  if (kind === "arrow") {
    return html`<div style=${{ flex: "none", fontFamily: FONT.sans, fontWeight: 400, fontSize: fs * 0.8, lineHeight: 1, color: win }}>
      <${Rise} p=${p} o=${o} axis=${vertical ? "y" : "x"}>${vertical ? "↓" : "→"}</${Rise}>
    </div>`;
  }
  if (kind === "vs") {
    return html`<div style=${{ flex: "none", fontFamily: FONT.serif, fontStyle: "italic", fontWeight: 500, fontSize: fs * 0.45, lineHeight: 1, color: win, opacity: p * (1 - o), transform: `scale(${0.6 + 0.4 * p})` }}>vs</div>`;
  }
  const th = Math.max(2 * u, fs * 0.02);
  return html`<div style=${{ flex: "none", alignSelf: "stretch", width: vertical ? fs * 2 : th, height: vertical ? th : "auto", minHeight: vertical ? 0 : fs * 1.2, margin: vertical ? "0 auto" : 0, background: hex(s.labelColor), opacity: 0.35 * (1 - o), transform: vertical ? `scaleX(${p})` : `scaleY(${p})` }}></div>`;
}

function CompareTemplate({ s, f, w, h, t }) {
  const M = t.M, P = comparePlan(s, M);
  const u = Math.min(w, h) / 1080, fs = s.size * u, hx = s.position[1];
  const padX = (w * s.margin) / 100;
  const orient = compareOrient(s, w, h);
  const o = exitAt(s, f, t, 0), oS = exitAt(s, f, t, 1);
  const labelSize = Math.max(fs * 0.2, 22 * u);
  const labelStyle = { fontFamily: FONT.sans, fontWeight: 500, fontSize: labelSize, lineHeight: 1.2, letterSpacing: "0.12em", textTransform: "uppercase", color: hex(s.labelColor) };

  const side = (left) => {
    const label = String(s[left ? "leftLabel" : "rightLabel"] || "").trim();
    const raw = String(s[left ? "leftValue" : "rightValue"] || "").trim();
    const start = left ? P.leftStart : P.rightStart;
    const winner = s.winner === (left ? "left" : "right");
    const loser = P.emphOn && !winner;
    const dimP = loser ? prog(f, P.emphStart, M.enter) : 0;
    const strikeP = loser && s.strike ? prog(f, P.emphStart + 2, M.enter) : 0;
    let text = raw;
    if (s.countUp) {
      const st = parseStat(raw);
      if (st.value !== null) text = `${st.prefix}${fmtNum(st.value * prog(f, start + 2, P.countF, EASE_COUNT), st.decimals, st.sep)}${st.suffix}`;
    }
    const valueStyle = { fontFamily: s.valueFont === "sans" ? FONT.sans : FONT.serif, fontWeight: Number(s.valueWeight), fontSize: fs, lineHeight: 1.1, letterSpacing: "-0.02em", whiteSpace: "nowrap", color: hex(winner ? s.winColor : s.textColor) };
    /* Only the text dims; the strike line stays at full strength over it. */
    const dimOp = 1 - dimP * (1 - s.dim / 100);
    return html`<div style=${{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center" }}>
      ${label && html`<${Rise} p=${prog(f, start, M.enter)} o=${oS} style=${{ ...labelStyle, opacity: dimOp }}>${label}</${Rise}>`}
      <div style=${{ position: "relative", marginTop: label ? fs * 0.12 : 0 }}>
        <${Rise} p=${prog(f, start + 2, M.enter)} o=${oS} style=${{ ...valueStyle, opacity: dimOp }}>${text}</${Rise}>
        ${strikeP > 0 && html`<div style=${{ position: "absolute", left: "-0.05em", right: "-0.05em", top: "50%", height: Math.max(3 * u, fs * 0.05), marginTop: -Math.max(3 * u, fs * 0.05) / 2, background: hex(s.winColor), transform: `scaleX(${strikeP * (1 - o)})`, transformOrigin: "left center", fontSize: fs }}></div>`}
      </div>
    </div>`;
  };

  const sep = html`<${CompareSeparator} kind=${s.separator} vertical=${orient === "column"} p=${prog(f, P.sepStart, M.enter)} o=${oS} fs=${fs} u=${u} s=${s} />`;
  const body = orient === "row"
    ? html`<div style=${{ display: "flex", flexDirection: "row", alignItems: "flex-end", gap: fs * 0.55 }}>${side(true)}<div style=${{ display: "flex", alignItems: "center", alignSelf: "flex-end", height: fs * 1.1 }}>${sep}</div>${side(false)}</div>`
    : html`<div style=${{ display: "flex", flexDirection: "column", alignItems: "center", gap: fs * 0.35 }}>${side(true)}${sep}${side(false)}</div>`;

  return html`<${Frame} s=${s} w=${w} h=${h} pos=${s.position}>
    <div style=${{ display: "flex", flexDirection: "column", alignItems: ITEMS[hx], maxWidth: w - 2 * padX }}>
      ${P.headOn && html`<div style=${{ fontFamily: FONT.serif, fontWeight: 500, fontSize: Math.max(fs * 0.55, 30 * u), lineHeight: 1.08, letterSpacing: "-0.015em", color: hex(s.headingColor), marginBottom: fs * 0.45, textAlign: ALIGN[hx], textWrap: "balance" }}>
        <${HighlightText} L=${planLines(s.heading, "words", 0, M)} entrance="words" f=${f} M=${M} o=${o} accentStyle=${accentStyleFor(s, "winColor")} />
      </div>`}
      ${body}
    </div>
  </${Frame}>`;
}

/* ----------------------------------------------------------- template: bar chart */
/* Bars grow from a zero baseline one after another while their values count up. One scale, one neutral
   bar colour plus the highlight colour on the bar that matters, values in the text colour, a faint
   baseline instead of gridlines, rounded data ends. Columns in 16:9, horizontal bars in 9:16 unless set. */

const parseBars = (text) => String(text || "").split("\n").map((x) => x.trim()).filter(Boolean).slice(0, 8).map((line) => {
  const [label, ...rest] = line.split("|");
  const raw = rest.join("|").trim();
  const st = parseStat(raw);
  return { label: label.trim(), raw, st, v: st.value !== null && st.value > 0 ? st.value : 0 };
});
const barsOrient = (s, w, h) => (s.orientation === "auto" ? ((w !== undefined ? w >= h : s.ratio !== "9:16") ? "columns" : "bars") : s.orientation);
const barText = (b, k) => (b.st.value === null ? b.raw : `${b.st.prefix}${fmtNum(b.st.value * k, b.st.decimals, b.st.sep)}${b.st.suffix}`);

function barsPlan(s, M) {
  const rows = parseBars(s.data);
  const headOn = s.headingOn && String(s.heading || "").trim();
  const t0 = headOn ? M.lead * 2 : 0;
  const barsStart = t0 + Math.round(M.enter * 0.5);
  const grow = Math.round(M.enter * 1.5);
  const stagger = Math.round(M.stagger * 3);
  const starts = rows.map((_, i) => barsStart + i * stagger);
  const max = Math.max(0, ...rows.map((r) => r.v)) || 1;
  let hi = -1;
  if (s.highlight === "max") hi = rows.reduce((best, r, i) => (r.v > (rows[best] ? rows[best].v : -1) ? i : best), 0);
  else if (s.highlight && s.highlight !== "none") hi = rows.findIndex((r) => r.label === s.highlight);
  const inF = Math.max(headOn ? M.enter : 0, rows.length ? starts[starts.length - 1] + grow : 0, 1);
  return { rows, headOn, t0, barsStart, grow, stagger, starts, max, hi, inF };
}

function BarsTemplate({ s, f, w, h, t }) {
  const M = t.M, P = barsPlan(s, M);
  const n = P.rows.length;
  const u = Math.min(w, h) / 1080, fs = s.size * u, hx = s.position[1];
  const padX = (w * s.margin) / 100;
  const orient = barsOrient(s, w, h);
  const o = exitAt(s, f, t, 0);
  const W = (w - 2 * padX) * (s.chartWidth / 100);
  const H = s.chartHeight * u;
  const r = Math.max(4, 6 * u);
  const labelIn = prog(f, P.t0, M.enter);
  const textColor = hex(s.labelColor);
  const valueStyle = { fontFamily: s.valueFont === "sans" ? FONT.sans : FONT.serif, fontWeight: 500, fontSize: fs * 1.1, lineHeight: 1.1, color: textColor, whiteSpace: "nowrap" };
  const catStyle = { fontFamily: FONT.sans, fontWeight: 400, fontSize: fs * 0.9, lineHeight: 1.25, color: textColor };
  const barFill = (i) => (i === P.hi ? { background: hex(s.highlightColor) } : { background: hex(s.barColor), opacity: s.barStrength / 100 });
  const showValue = (i) => s.values === "all" || (s.values === "highlight" && i === P.hi);
  const kOf = (i) => prog(f, P.starts[i], P.grow, EASE_COUNT);
  const baseline = Math.max(2, 2 * u);

  let chart;
  if (orient === "columns") {
    const slot = n ? W / n : W;
    const barW = Math.min(slot * 0.58, fs * 5);
    const valueH = fs * 1.6;
    const barMax = Math.max(10, H - valueH);
    chart = html`<div style=${{ width: W }}>
      <div style=${{ position: "relative", height: H, display: "flex", alignItems: "flex-end" }}>
        ${P.rows.map((b, i) => { const k = kOf(i); const bh = (b.v / P.max) * barMax * k;
          return html`<div key=${i} style=${{ flex: "1 1 0", minWidth: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%" }}>
            ${showValue(i) && html`<div style=${{ ...valueStyle, marginBottom: fs * 0.3, opacity: prog(f, P.starts[i], Math.round(M.enter * 0.6)) }}>${barText(b, k)}</div>`}
            <div style=${{ width: barW, height: bh, borderRadius: `${r}px ${r}px 0 0`, ...barFill(i) }}></div>
          </div>`; })}
        ${s.baseline && html`<div style=${{ position: "absolute", left: 0, right: 0, bottom: -baseline / 2, height: baseline, background: textColor, opacity: 0.35 * labelIn, transform: `scaleX(${labelIn})`, transformOrigin: "left center" }}></div>`}
      </div>
      <div style=${{ display: "flex", marginTop: fs * 0.5 }}>
        ${P.rows.map((b, i) => html`<div key=${i} style=${{ flex: "1 1 0", minWidth: 0, textAlign: "center", padding: "0 0.2em", ...catStyle, opacity: 0.85 * labelIn, transform: `translateY(${(1 - labelIn) * 0.4}em)` }}>${b.label}</div>`)}
      </div>
    </div>`;
  } else {
    const rowH = Math.max(fs * 1.5, Math.min(fs * 2.6, H / Math.max(1, n)));
    const barH = rowH * 0.62;
    /* Rows touch (no grid gap) so the baseline, each bar cell's left border, reads as one line. */
    chart = html`<div style=${{ width: W, display: "grid", gridTemplateColumns: "max-content 1fr", columnGap: fs * 0.6, alignItems: "center" }}>
      ${P.rows.map((b, i) => { const k = kOf(i); const pct = (b.v / P.max) * 100 * k;
        return html`<${Fragment} key=${i}>
          <div style=${{ ...catStyle, textAlign: "right", opacity: 0.85 * labelIn }}>${b.label}</div>
          <div style=${{ display: "flex", alignItems: "center", height: rowH, paddingRight: fs * 4.5, borderLeft: s.baseline ? `${baseline}px solid ${textColor}59` : "none" }}>
            <div style=${{ width: `${pct}%`, height: barH, borderRadius: `0 ${r}px ${r}px 0`, flex: "none", ...barFill(i) }}></div>
            ${showValue(i) && html`<div style=${{ ...valueStyle, marginLeft: fs * 0.35, opacity: prog(f, P.starts[i], Math.round(M.enter * 0.6)) }}>${barText(b, k)}</div>`}
          </div>
        </${Fragment}>`; })}
    </div>`;
  }

  return html`<${Frame} s=${s} w=${w} h=${h} pos=${s.position}>
    <div style=${{ display: "flex", flexDirection: "column", alignItems: ITEMS[hx], maxWidth: w - 2 * padX, opacity: 1 - o, transform: `translateY(${-o * fs * 0.4}px)` }}>
      ${P.headOn && html`<div style=${{ fontFamily: FONT.serif, fontWeight: 500, fontSize: fs * 1.7, lineHeight: 1.08, letterSpacing: "-0.015em", color: hex(s.headingColor), marginBottom: fs * 1.1, textAlign: ALIGN[hx], textWrap: "balance" }}>
        <${HighlightText} L=${planLines(s.heading, "words", 0, M)} entrance="words" f=${f} M=${M} o=${0} accentStyle=${accentStyleFor(s, "highlightColor")} />
      </div>`}
      ${chart}
    </div>
  </${Frame}>`;
}

/* ---------------------------------------------------------- template: chapter card */
/* A section number ("01") with a divider line and the section title, to split up longer videos.
   The number rises or rolls in, the line draws, then the eyebrow, title and subtitle follow. */

const chapterLayout = (s, w, h) => (s.layout === "auto" ? ((w !== undefined ? w >= h : s.ratio !== "9:16") ? "side" : "stacked") : s.layout);

function chapterPlan(s, M) {
  const num = String(s.number || "").trim();
  const ebOn = s.eyebrowOn && String(s.eyebrow || "").trim();
  const subOn = s.subtitleOn && String(s.subtitle || "").trim();
  const lineStart = Math.round(M.enter * 0.45);
  const textT0 = Math.round(M.enter * 0.6);
  const L = planLines(s.title, s.entrance, textT0 + (ebOn ? M.lead : 0), M);
  const subStart = L.last + M.lead;
  const digits = (num.match(/\d/g) || []).length;
  const rollF = Math.round(M.enter * 1.6);
  const rollStagger = M.stagger * 2;
  const numEnd = s.numberStyle === "roll" && digits ? rollF + Math.max(0, digits - 1) * rollStagger : M.enter;
  const inF = Math.max(num ? numEnd : 0, s.lineOn ? lineStart + M.enter : 0, ebOn ? textT0 + M.enter : 0, L.lines.length ? L.last + M.enter : 0, subOn ? subStart + M.enter : 0, 1);
  return { num, ebOn, subOn, lineStart, textT0, L, subStart, rollF, rollStagger, inF };
}

/* Digits roll up like an odometer (each column its own mask); anything else fades in. */
function RollText({ text, f, start, dur, stagger, o }) {
  const box = { display: "inline-block", height: "1.05em", lineHeight: "1.05em", verticalAlign: "top" };
  let di = 0;
  const pStatic = prog(f, start, Math.round(dur * 0.5));
  return html`<div style=${{ display: "flex", alignItems: "flex-start", whiteSpace: "nowrap", opacity: 1 - o, transform: `translateY(${-o * 0.25}em)` }}>${text.split("").map((ch, i) => {
    if (!/\d/.test(ch)) return html`<span key=${i} style=${{ ...box, opacity: pStatic, whiteSpace: "pre" }}>${ch}</span>`;
    const k = prog(f, start + di++ * stagger, dur, EASE_COUNT);
    const steps = (10 + Number(ch)) * k;
    return html`<span key=${i} style=${{ ...box, position: "relative", overflow: "hidden" }}>
      <span style=${{ opacity: 0 }}>${ch}</span>
      <span style=${{ position: "absolute", left: "50%", top: 0, transform: `translate(-50%, ${-steps * 1.05}em)` }}>${STACK.map((n, j) =>
        html`<span key=${j} style=${{ display: "block", height: "1.05em", lineHeight: "1.05em", textAlign: "center" }}>${n}</span>`)}</span>
    </span>`;
  })}</div>`;
}

function ChapterTemplate({ s, f, w, h, t }) {
  const M = t.M, P = chapterPlan(s, M);
  const u = Math.min(w, h) / 1080, fs = s.size * u, ns = s.numberSize * u, hx = s.position[1];
  const padX = (w * s.margin) / 100;
  const layout = chapterLayout(s, w, h);
  const accent = hex(s.accentColor);
  const o0 = exitAt(s, f, t, 0), o1 = exitAt(s, f, t, 1), o2 = exitAt(s, f, t, 2);
  const numStyle = { fontFamily: FONT.serif, fontWeight: Number(s.numberWeight), fontSize: ns, lineHeight: 1.05, letterSpacing: "-0.03em", color: hex(s.numberColor) };
  const number = P.num && html`<div style=${{ ...numStyle, flex: "none" }}>${s.numberStyle === "roll"
    ? html`<${RollText} text=${P.num} f=${f} start=${0} dur=${P.rollF} stagger=${P.rollStagger} o=${o0} />`
    : html`<${Rise} p=${prog(f, 0, M.enter)} o=${o0}>${P.num}</${Rise}>`}</div>`;
  const pLine = prog(f, P.lineStart, M.enter);
  const thick = Math.max(3 * u, fs * 0.05);
  const ebSize = Math.max(fs * 0.27, 22 * u);
  const pSub = prog(f, P.subStart, M.enter);
  const text = html`<div style=${{ display: "flex", flexDirection: "column", alignItems: layout === "side" ? "flex-start" : ITEMS[hx], textAlign: layout === "side" ? "left" : ALIGN[hx], minWidth: 0 }}>
    ${P.ebOn && html`<div style=${{ fontFamily: FONT.sans, fontWeight: 500, fontSize: ebSize, lineHeight: 1.2, letterSpacing: "0.14em", textTransform: "uppercase", color: hex(s.eyebrowColor), marginBottom: fs * 0.22 }}>
      <${Rise} p=${prog(f, P.textT0, M.enter)} o=${o1}>${s.eyebrow}</${Rise}></div>`}
    <div style=${{ fontFamily: FONT.serif, fontWeight: Number(s.weight), fontSize: fs, lineHeight: 1.06, letterSpacing: "-0.015em", color: hex(s.titleColor), textWrap: "balance" }}>
      <${HighlightText} L=${P.L} entrance=${s.entrance} f=${f} M=${M} o=${o1} accentStyle=${accentStyleFor(s)} />
    </div>
    ${P.subOn && html`<div style=${{ fontFamily: FONT.sans, fontWeight: 400, fontSize: Math.max(fs * 0.34, 22 * u), lineHeight: 1.35, color: hex(s.subColor), marginTop: fs * 0.3, opacity: pSub * (1 - o2), transform: `translateY(${(1 - pSub) * 0.5 - o2 * 0.3}em)` }}>${s.subtitle}</div>`}
  </div>`;

  let body;
  if (layout === "side") {
    body = html`<div style=${{ display: "flex", flexDirection: "row", alignItems: "stretch", gap: fs * 0.55, maxWidth: ((w - 2 * padX) * s.maxWidth) / 100 }}>
      ${number && html`<div style=${{ display: "flex", alignItems: "center" }}>${number}</div>`}
      ${s.lineOn && html`<div style=${{ flex: "none", width: thick, background: hex(s.lineColor), transform: `scaleY(${pLine * (1 - o2)})`, transformOrigin: "center top" }}></div>`}
      <div style=${{ display: "flex", alignItems: "center", minWidth: 0 }}>${text}</div>
    </div>`;
  } else {
    body = html`<div style=${{ display: "flex", flexDirection: "column", alignItems: ITEMS[hx], maxWidth: ((w - 2 * padX) * s.maxWidth) / 100 }}>
      ${number}
      ${s.lineOn && html`<div style=${{ width: fs * 1.4, height: thick, background: hex(s.lineColor), margin: `${fs * 0.35}px 0 ${fs * 0.45}px`, transform: `scaleX(${pLine * (1 - o2)})`, transformOrigin: hx === "c" ? "center" : hx === "r" ? "right center" : "left center" }}></div>`}
      ${text}
    </div>`;
  }
  return html`<${Frame} s=${s} w=${w} h=${h} pos=${s.position}>${body}</${Frame}>`;
}

/* ------------------------------------------------------------- template: caption */
/* Punchy kinetic text for social cuts: words pop in one by one at reading pace. *Highlighted* words take
   the accent colour or sit in an accent box; an optional background box sits behind the whole caption. */

function captionPlan(s, M) {
  const boxOn = !!s.boxOn;
  const wordM = { ...M, stagger: M.stagger * 2.5 };
  const t0 = boxOn ? Math.round(M.enter * 0.4) : 0;
  const L = planLines(s.upper ? String(s.text || "").toUpperCase() : s.text, s.entrance === "fade" ? "lines" : "words", t0, wordM);
  const inF = Math.max(boxOn ? M.enter : 0, L.lines.length ? L.last + M.enter : 0, 1);
  return { boxOn, L, inF };
}

function CaptionTemplate({ s, f, w, h, t }) {
  const M = t.M, P = captionPlan(s, M);
  const u = Math.min(w, h) / 1080, fs = s.size * u, hx = s.position[1];
  const padX = (w * s.margin) / 100, maxW = ((w - 2 * padX) * s.maxWidth) / 100;
  const o = exitAt(s, f, t, 0), oBox = exitAt(s, f, t, 2);
  const accent = hex(s.accentColor), ink = hex(s.textColor);
  const boxHi = s.highlightStyle === "box";
  const hiInk = LIGHT_SWATCHES.includes(s.accentColor) ? "#1a2e1e" : "#ffffff";

  const segs = (word, nextStartsHi) => word.map((g, k) => {
    if (!g.a) return html`<span key=${k}>${g.t}</span>`;
    if (!boxHi) return html`<span key=${k} style=${{ color: accent, fontStyle: s.accentItalic ? "italic" : "normal" }}>${g.t}</span>`;
    /* A box highlight runs on into the next word when that word is highlighted too. */
    const runOn = k === word.length - 1 && nextStartsHi;
    return html`<span key=${k} style=${{ display: "inline-block", background: accent, color: hiInk, padding: "0 0.16em", margin: "0 -0.04em", borderRadius: "0.12em" }}>${g.t}${runOn ? " " : ""}</span>`;
  });

  const lines = P.L.lines.map((line, li) => {
    if (s.entrance === "fade") {
      const p = prog(f, P.L.starts[li][0], M.enter);
      return html`<div key=${li} style=${{ opacity: p * (1 - o), transform: `translateY(${(1 - p) * 0.35 - o * 0.2}em)` }}>${line.map((word, j) => {
        const next = line[j + 1];
        const hiJoin = boxHi && word[word.length - 1].a && next && next[0].a;
        return html`<${Fragment} key=${j}>${j && !(boxHi && line[j - 1][line[j - 1].length - 1].a && word[0].a) ? " " : ""}${segs(word, hiJoin)}</${Fragment}>`;
      })}</div>`;
    }
    return html`<div key=${li}>${line.map((word, j) => {
      const start = P.L.starts[li][j];
      const next = line[j + 1];
      const hiJoin = boxHi && word[word.length - 1].a && next && next[0].a;
      const joined = j && boxHi && line[j - 1][line[j - 1].length - 1].a && word[0].a;
      const gap = j && !joined ? " " : "";
      if (s.entrance === "rise") return html`<${Fragment} key=${j}>${gap}<${Rise} p=${prog(f, start, M.enter)} o=${o}>${segs(word, hiJoin)}</${Rise}></${Fragment}>`;
      const pop = Math.max(0, spring({ fps: FPS, frame: f - start, config: { damping: 12 }, durationInFrames: Math.round(M.enter * 0.7) }));
      const fade = prog(f, start, Math.round(M.enter * 0.3));
      return html`<${Fragment} key=${j}>${gap}<span style=${{ display: "inline-block", opacity: fade * (1 - o), transform: `scale(${0.55 + 0.45 * pop})`, transformOrigin: "50% 80%" }}>${segs(word, hiJoin)}</span></${Fragment}>`;
    })}</div>`;
  });

  const textStyle = { fontFamily: s.font === "serif" ? FONT.serif : FONT.sans, fontWeight: Number(s.weight), fontSize: fs, lineHeight: 1.28, letterSpacing: s.upper ? "0.02em" : "-0.01em", color: ink, textAlign: ALIGN[hx], textWrap: "balance" };
  const pBox = prog(f, 0, M.enter);
  return html`<${Frame} s=${s} w=${w} h=${h} pos=${s.position}>
    <div style=${{ position: "relative", maxWidth: maxW, padding: P.boxOn ? `${fs * 0.32}px ${fs * 0.55}px ${fs * 0.36}px` : 0 }}>
      ${P.boxOn && html`<div style=${{ position: "absolute", inset: 0, background: hex(s.boxColor), borderRadius: fs * 0.22, opacity: s.boxOpacity / 100, transform: `scaleX(${pBox * (1 - oBox)})`, transformOrigin: originFor(hx) }}></div>`}
      <div style=${{ position: "relative", ...textStyle }}>${lines}</div>
    </div>
  </${Frame}>`;
}

/* ---------------------------------------------------------- template: corner tag */
/* A small tag that sits in a corner while the footage runs: a URL, a handle, or a place and date.
   The pill (or bar) wipes in from the corner side, the marker pops, the text slides out from behind it.
   The live dot keeps pulsing through the hold. */

const FLAG_NAMES = { gb: "United Kingdom", nl: "Netherlands", be: "Belgium", pl: "Poland", de: "Germany", fr: "France", ie: "Ireland", es: "Spain", it: "Italy", eu: "European Union", us: "United States", ca: "Canada", au: "Australia" };
const FLAG_OPTIONS = Object.entries(FLAG_NAMES).map(([k, v]) => [k, v]);

function tagPlan(s, M) {
  const subOn = s.subOn && String(s.sub || "").trim();
  const textStart = Math.round(M.enter * 0.35);
  const subStart = textStart + Math.round(M.stagger * 2.5);
  const inF = Math.max(M.enter, (subOn ? subStart : textStart) + M.enter, 1);
  return { subOn, textStart, subStart, inF };
}

function TagMarker({ kind, size, s, f, p }) {
  const color = hex(s.accentColor);
  if (kind === "none") return null;
  if (kind === "flag") {
    const svg = FLAG_SVGS[s.flagCode];
    if (!svg) return null;
    return html`<${Img} src=${"data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg)} style=${{ width: size * 1.15, height: size * 1.15, borderRadius: "50%", flex: "none", transform: `scale(${p})` }} />`;
  }
  if (kind === "pulse") {
    const cycle = 30, k = (f % cycle) / cycle;
    return html`<span style=${{ position: "relative", flex: "none", width: size * 0.62, height: size * 0.62, transform: `scale(${p})` }}>
      <span style=${{ position: "absolute", inset: 0, borderRadius: "50%", background: color, opacity: (1 - k) * 0.6, transform: `scale(${1 + k * 1.4})` }}></span>
      <span style=${{ position: "absolute", inset: 0, borderRadius: "50%", background: color }}></span>
    </span>`;
  }
  const m = size * 0.5;
  const base = { flex: "none", width: m, height: m, background: color };
  if (kind === "circle") base.borderRadius = "50%";
  return html`<span style=${{ ...base, transform: kind === "diamond" ? `scale(${p * 0.78}) rotate(45deg)` : `scale(${p})` }}></span>`;
}

function TagTemplate({ s, f, w, h, t }) {
  const M = t.M, P = tagPlan(s, M);
  const u = Math.min(w, h) / 1080, fs = s.size * u;
  const vy = s.corner[0], hx = s.corner[1];
  const right = hx === "r";
  const origin = originFor(hx);
  const oText = exitAt(s, f, t, 0), oShape = exitAt(s, f, t, 2);
  const pPlate = prog(f, 0, M.enter);
  const pMark = Math.max(0, spring({ fps: FPS, frame: f - P.textStart, config: { damping: 12 }, durationInFrames: Math.round(M.enter * 0.7) })) * (1 - oText);
  const dir = right ? -1 : 1;
  const serif = s.font === "serif";
  const mainStyle = { fontFamily: serif ? FONT.serif : FONT.sans, fontWeight: Number(s.weight), fontSize: fs, lineHeight: 1.15, color: hex(s.textColor), whiteSpace: "nowrap" };
  const subStyle = { fontFamily: FONT.sans, fontWeight: 400, fontSize: fs * 0.72, lineHeight: 1.25, color: hex(s.textColor), opacity: 0.8, whiteSpace: "nowrap" };
  const axis = hx === "c" ? "y" : "x";
  const text = html`<div style=${{ display: "flex", flexDirection: "column", alignItems: right ? "flex-end" : hx === "c" ? "center" : "flex-start", gap: fs * 0.08 }}>
    <${Rise} p=${prog(f, P.textStart, M.enter)} o=${oText} axis=${axis} dir=${dir} style=${mainStyle}>${s.text}</${Rise}>
    ${P.subOn && html`<${Rise} p=${prog(f, P.subStart, M.enter)} o=${oText} axis=${axis} dir=${dir} style=${subStyle}>${s.sub}</${Rise}>`}
  </div>`;
  const marker = html`<${TagMarker} kind=${s.marker} size=${fs} s=${s} f=${f} p=${pMark} />`;
  const row = html`<div style=${{ position: "relative", display: "flex", flexDirection: right ? "row-reverse" : "row", alignItems: "center", gap: fs * 0.45 }}>${s.marker !== "none" && marker}${text}</div>`;

  let body;
  if (s.style === "pill") {
    body = html`<div style=${{ position: "relative", display: "inline-flex", padding: P.subOn ? `${fs * 0.42}px ${fs * 0.8}px` : `${fs * 0.36}px ${fs * 0.75}px` }}>
      <div style=${{ position: "absolute", inset: 0, borderRadius: 9999, background: hex(s.bgColor), opacity: s.bgStrength / 100, transform: `scaleX(${pPlate * (1 - oShape)})`, transformOrigin: origin }}></div>
      ${row}
    </div>`;
  } else if (s.style === "bar") {
    const thick = Math.max(3 * u, fs * 0.1);
    body = html`<div style=${{ display: "flex", flexDirection: right ? "row-reverse" : "row", alignItems: "stretch", gap: fs * 0.45 }}>
      <div style=${{ flex: "none", width: thick, background: hex(s.accentColor), transform: `scaleY(${pPlate * (1 - oShape)})`, transformOrigin: vy === "t" ? "top" : "bottom" }}></div>
      ${row}
    </div>`;
  } else {
    body = row;
  }
  return html`<${Frame} s=${s} w=${w} h=${h} pos=${s.corner}>${body}</${Frame}>`;
}

/* ------------------------------------------------------------ template: map pins */
/* Places pop onto the website's world map one after another, with optional arcs drawn out from a hub.
   The camera frames the pins (or a chosen region) and can push in slowly. Labels avoid each other by
   trying right, left, above and below each pin. Shares the map file, projection and canvas approach
   with Map flight. */

const REGIONS = { europe: [35, -11, 62, 30], world: [-55, -170, 75, 180], namerica: [15, -130, 60, -60], ukbenelux: [49.5, -6.5, 56, 8.5] };
const placeKey = (name) => {
  const n = name.toLowerCase();
  return Object.keys(PLACES).find((k) => k.toLowerCase() === n || k.split(",")[0].trim().toLowerCase() === n);
};
function parsePins(text) {
  const pins = [], unknown = [];
  for (const line of String(text || "").split("\n").map((x) => x.trim()).filter(Boolean).slice(0, 24)) {
    const p = parsePinLine(line);
    if (p) pins.push(p); else unknown.push(line);
  }
  return { pins, unknown };
}

function pinsPlan(s, M) {
  const { pins } = parsePins(s.pins);
  const hubIdx = s.hub && s.hub !== "none" ? pins.findIndex((p) => p.label === s.hub) : -1;
  /* The hub (if any) lands first, then the rest in list order. */
  const order = hubIdx >= 0 ? [hubIdx, ...pins.map((_, i) => i).filter((i) => i !== hubIdx)] : pins.map((_, i) => i);
  const gap = Math.max(2, Math.round(M.stagger * 3));
  const start = {};
  order.forEach((idx, k) => { start[idx] = 4 + k * gap; });
  const lastPin = pins.length ? 4 + (pins.length - 1) * gap : 0;
  const arcsOn = hubIdx >= 0 && pins.length > 1;
  const arcStart = lastPin + Math.round(M.enter * 0.5);
  const arcGap = Math.max(2, Math.round(M.stagger * 2));
  const arcF = Math.round(M.enter * 1.4);
  const inF = Math.max(pins.length ? lastPin + M.enter + 6 : 0, arcsOn ? arcStart + (pins.length - 2) * arcGap + arcF : 0, 1);
  return { pins, hubIdx, order, start, arcsOn, arcStart, arcGap, arcF, inF };
}

function pinsCamera(s, pins, w, h) {
  let box = REGIONS[s.region], pad = 0.06;
  if (!box) {
    if (!pins.length) box = REGIONS.europe;
    else { box = [Math.min(...pins.map((p) => p.lat)), Math.min(...pins.map((p) => p.lng)), Math.max(...pins.map((p) => p.lat)), Math.max(...pins.map((p) => p.lng))]; pad = 0.22; }
  }
  const a = merc(box[0], box[1]), b = merc(box[2], box[3]);
  const bw = Math.max(Math.abs(b.x - a.x), 1e-3), bh = Math.max(Math.abs(b.y - a.y), 1e-3);
  let zoom = Math.log2((Math.min((w * (1 - 2 * pad)) / bw, (h * (1 - 2 * pad)) / bh) * MAP_WORLD) / 512);
  if (!REGIONS[s.region] && pins.length === 1) zoom = 5;
  return { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, zoom: clamp(zoom + (Number(s.zoomAdjust) || 0), 0.5, 9) };
}

const arcPoint = (p0, p2, t) => {
  const dx = p2.x - p0.x, dy = p2.y - p0.y, len = Math.hypot(dx, dy) || 1;
  let nx = -dy / len, ny = dx / len;
  if (ny > 0) { nx = -nx; ny = -ny; }
  const p1 = { x: (p0.x + p2.x) / 2 + nx * len * 0.2, y: (p0.y + p2.y) / 2 + ny * len * 0.2 };
  const a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
  return { x: a * p0.x + b * p1.x + c * p2.x, y: a * p0.y + b * p1.y + c * p2.y };
};

function PinsCanvas({ w, h, u, cam, data, s, arcs }) {
  const ref = useRef(null);
  useLayoutEffect(() => {
    const c = ref.current;
    if (!c) return;
    const x = c.getContext("2d");
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.clearRect(0, 0, w, h);
    if (s.seaOn) { x.fillStyle = hex(s.seaColor); x.fillRect(0, 0, w, h); }
    if (!data) return;
    const k = pxPerUnit(cam.zoom);
    x.setTransform(k, 0, 0, k, w / 2 - cam.cx * k, h / 2 - cam.cy * k);
    x.globalAlpha = s.landStrength / 100;
    x.fillStyle = hex(s.landColor);
    x.fill(data.land);
    x.globalAlpha = 1;
    if (s.borders && s.seaOn) { x.strokeStyle = hex(s.seaColor); x.lineWidth = (1.2 * u) / k; x.lineJoin = "round"; x.stroke(data.land); }
    x.strokeStyle = hex(s.pinColor);
    x.lineWidth = (3.5 * u) / k;
    x.lineCap = "round";
    x.setLineDash(s.arcStyle === "dashed" ? [(12 * u) / k, (10 * u) / k] : []);
    for (const arc of arcs) {
      if (arc.p <= 0) continue;
      x.beginPath();
      for (let i = 0; i <= 60; i++) {
        const pt = arcPoint(arc.from, arc.to, (arc.p * i) / 60);
        if (i === 0) x.moveTo(pt.x, pt.y); else x.lineTo(pt.x, pt.y);
      }
      x.stroke();
    }
    x.setLineDash([]);
  });
  return html`<canvas ref=${ref} width=${w} height=${h} style=${{ position: "absolute", left: 0, top: 0, width: w, height: h }}></canvas>`;
}

/* Greedy label placement: right, left, above, below — the first spot clear of other labels, pins and the frame edge. */
function placeLabels(items, w, h, fs, r) {
  const placed = [];
  const hits = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const pinsBoxes = items.map((it) => ({ x: it.x - r, y: it.y - r, w: r * 2, h: r * 2 }));
  return items.map((it, i) => {
    if (!it.label) return null;
    const lw = it.label.length * fs * 0.56 + fs * 0.2, lh = fs * 1.25, gap = r + fs * 0.3;
    const cands = [
      { side: "right", x: it.x + gap, y: it.y - lh / 2 },
      { side: "left", x: it.x - gap - lw, y: it.y - lh / 2 },
      { side: "above", x: it.x - lw / 2, y: it.y - gap - lh },
      { side: "below", x: it.x - lw / 2, y: it.y + gap },
    ].map((c) => ({ ...c, w: lw, h: lh }));
    const ok = (c) => c.x >= 0 && c.y >= 0 && c.x + c.w <= w && c.y + c.h <= h
      && !placed.some((p) => p && hits(c, p)) && !pinsBoxes.some((p, j) => j !== i && hits(c, p));
    const pick = cands.find(ok) || cands[0];
    placed.push(pick);
    return pick;
  });
}

function PinsTemplate({ s, f, w, h, t }) {
  const data = useWorldMap();
  const M = t.M, P = pinsPlan(s, M);
  const u = Math.min(w, h) / 1080, fs = s.labelSize * u;
  const base = useMemo(() => pinsCamera(s, P.pins, w, h), [w, h, s.pins, s.region, s.zoomAdjust]);
  const cam = { ...base, zoom: base.zoom + (s.push ? 0.22 * (f / Math.max(1, t.total)) : 0) };
  const k = pxPerUnit(cam.zoom);
  const screen = (p) => { const m = merc(p.lat, p.lng); return { x: w / 2 + (m.x - cam.cx) * k, y: h / 2 + (m.y - cam.cy) * k }; };
  const pts = P.pins.map(screen);
  const r = 14 * u * (s.pinSize / 100);
  const o = exitAt(s, f, t, 0);
  const showLabel = (i) => s.labels === "all" || (s.labels === "hub" && i === P.hubIdx);
  const spots = placeLabels(P.pins.map((p, i) => ({ ...pts[i], label: showLabel(i) ? p.label : "" })), w, h, fs, s.pinStyle === "pin" ? r * 1.4 : r * 1.25);
  const arcs = P.arcsOn ? P.order.slice(1).map((idx, j) => ({
    from: merc(P.pins[P.hubIdx].lat, P.pins[P.hubIdx].lng), to: merc(P.pins[idx].lat, P.pins[idx].lng),
    p: prog(f, P.arcStart + j * P.arcGap, P.arcF, SEG_EASE),
  })) : [];
  const accent = hex(s.pinColor);
  return html`<${AbsoluteFill} style=${{ opacity: 1 - o, overflow: "hidden" }}>
    <${PinsCanvas} w=${w} h=${h} u=${u} cam=${cam} data=${data} s=${s} arcs=${arcs} />
    ${P.pins.map((p, i) => {
      const st = P.start[i];
      if (f < st) return null;
      const pop = Math.max(0, spring({ fps: FPS, frame: f - st, config: { damping: 11 }, durationInFrames: Math.round(M.enter * 0.8) }));
      const hub = i === P.hubIdx;
      const rr = hub ? r * 1.35 : r;
      const { x, y } = pts[i];
      let mark;
      if (s.pinStyle === "pin") {
        const size = rr * 2.6, ph = (size * 4) / 3;
        mark = html`<${Img} src=${pinSrc(accent)} style=${{ position: "absolute", left: x - size / 2, top: y - ph, width: size, height: ph, transformOrigin: "50% 100%", transform: `translateY(${(1 - pop) * -60 * u}px) scale(${0.4 + 0.6 * pop})` }} />`;
      } else {
        let code = p.code === "uk" ? "gb" : p.code;
        const flag = s.pinStyle === "flag" && FLAG_SVGS[code];
        const cycle = 36, kk = (f % cycle) / cycle;
        mark = html`<div style=${{ position: "absolute", left: x - rr, top: y - rr, width: rr * 2, height: rr * 2, transform: `scale(${pop})` }}>
          ${hub && html`<div style=${{ position: "absolute", inset: 0, borderRadius: "50%", background: accent, opacity: (1 - kk) * 0.5, transform: `scale(${1 + kk * 1.6})` }}></div>`}
          ${flag
            ? html`<${Img} src=${"data:image/svg+xml;charset=utf-8," + encodeURIComponent(FLAG_SVGS[code])} style=${{ position: "absolute", inset: 0, width: rr * 2, height: rr * 2, borderRadius: "50%", border: `${Math.max(2, rr * 0.16)}px solid #ffffff` }} />`
            : html`<div style=${{ position: "absolute", inset: 0, borderRadius: "50%", background: accent, border: `${Math.max(2, rr * 0.22)}px solid #ffffff` }}></div>`}
        </div>`;
      }
      const spot = spots[i];
      const lp = prog(f, st + 4, M.enter);
      const shift = spot && (spot.side === "right" ? { x: -12 * u, y: 0 } : spot.side === "left" ? { x: 12 * u, y: 0 } : spot.side === "above" ? { x: 0, y: 10 * u } : { x: 0, y: -10 * u });
      return html`<${Fragment} key=${i}>
        ${mark}
        ${spot && html`<div style=${{ position: "absolute", left: spot.x, top: spot.y, width: spot.w, textAlign: spot.side === "left" ? "right" : spot.side === "right" ? "left" : "center", whiteSpace: "nowrap",
          fontFamily: s.labelFont === "serif" ? FONT.serif : FONT.sans, fontWeight: s.labelFont === "serif" ? 500 : 700, fontSize: fs, lineHeight: 1.25, color: hex(s.labelColor),
          opacity: lp, transform: `translate(${(1 - lp) * shift.x}px, ${(1 - lp) * shift.y}px)` }}>${p.label}</div>`}
      </${Fragment}>`;
    })}
  </${AbsoluteFill}>`;
}

/* ---------------------------------------------------------- template: line graph */
/* Up to four lines on one value axis, drawing left to right. The brand palette has one strong chart
   hue (magenta; white reads as grey and Forest is too dark on Deep Forest), so lines are told apart by
   line style as well as colour, labelled at their ends and listed in a legend; colour is never the only
   cue. Hairline gridlines, clean tick values, text in the text colour, values at the line ends. */

const LINE_EASE = Easing.bezier(0.45, 0, 0.2, 1);

function parseLineData(s) {
  const xs = String(s.points || "").split(",").map((x) => x.trim()).filter(Boolean);
  const series = String(s.series || "").split("\n").map((x) => x.trim()).filter(Boolean).slice(0, 4).map((line) => {
    const bar = line.indexOf("|");
    const name = bar >= 0 ? line.slice(0, bar).trim() : "";
    const vals = bar >= 0 ? line.slice(bar + 1) : line;
    return { name, values: vals.split(/[,;]/).map((v) => { const n = parseFloat(v.trim()); return Number.isFinite(n) ? n : null; }) };
  }).filter((sr) => sr.values.some((v) => v !== null));
  const n = Math.max(xs.length, ...series.map((sr) => sr.values.length), 1);
  return { xs, series, n };
}

/* Clean ticks: steps of 1, 2, 2.5 or 5 × 10^k, about four of them. */
function niceTicks(lo, hi, count = 4) {
  if (hi <= lo) hi = lo + 1;
  const raw = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((st) => st >= raw) || 10 * mag;
  const start = Math.floor(lo / step) * step, end = Math.ceil(hi / step) * step;
  const ticks = [];
  for (let v = start; v <= end + step * 1e-9; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return { ticks, lo: start, hi: end };
}

function linesPlan(s, M) {
  const D = parseLineData(s);
  const headOn = s.headingOn && String(s.heading || "").trim();
  const t0 = headOn ? M.lead * 2 : 0;
  const drawStart = t0 + Math.round(M.enter * 0.5);
  const drawF = Math.round(M.enter * 2.6);
  const gap = s.drawOrder === "sequence" ? Math.round(drawF * 0.6) : Math.round(M.stagger * 2);
  const starts = D.series.map((_, i) => drawStart + i * gap);
  const inF = Math.max(headOn ? M.enter : 0, D.series.length ? starts[starts.length - 1] + drawF + Math.round(M.enter * 0.6) : 0, 1);
  return { ...D, headOn, t0, drawStart, drawF, starts, inF };
}

const DASHES = { solid: [], dashed: [16, 10], dotted: [0.1, 10] };

/* Monotone cubic (Fritsch–Carlson) so smoothed lines never overshoot the data. */
function sampleLine(pts, smooth) {
  if (!smooth || pts.length < 3) return pts;
  const n = pts.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((pts[i + 1].y - pts[i].y) / (pts[i + 1].x - pts[i].x));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], hh = a * a + b * b;
    if (hh > 9) { const tt = 3 / Math.sqrt(hh); m[i] = tt * a * d[i]; m[i + 1] = tt * b * d[i]; }
  }
  const out = [];
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[i], p1 = pts[i + 1], dx = p1.x - p0.x;
    for (let k = 0; k < 16; k++) {
      const t = k / 16, t2 = t * t, t3 = t2 * t;
      const h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h01 = -2 * t3 + 3 * t2, h11 = t3 - t2;
      out.push({ x: p0.x + dx * t, y: h00 * p0.y + h10 * dx * m[i] + h01 * p1.y + h11 * dx * m[i + 1] });
    }
  }
  out.push(pts[n - 1]);
  return out;
}

/* The first p (0–1) of a polyline by length, and where it ends. */
function partialLine(pts, p) {
  if (pts.length < 2 || p >= 1) return { pts, end: pts[pts.length - 1] };
  const lens = [0];
  for (let i = 1; i < pts.length; i++) lens.push(lens[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const target = lens[lens.length - 1] * Math.max(0, p);
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (lens[i] >= target) {
      const k = (target - lens[i - 1]) / ((lens[i] - lens[i - 1]) || 1);
      const e = { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * k, y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * k };
      out.push(e);
      return { pts: out, end: e };
    }
    out.push(pts[i]);
  }
  return { pts: out, end: pts[pts.length - 1] };
}

function LineKey({ style, color, u, opacity }) {
  const wk = 34 * u, th = Math.max(3, 4 * u);
  const seg = (left, width) => html`<span style=${{ position: "absolute", left, top: "50%", width, height: th, marginTop: -th / 2, borderRadius: th, background: color }}></span>`;
  let parts;
  if (style === "dashed") parts = [seg(0, wk * 0.42), seg(wk * 0.58, wk * 0.42)];
  else if (style === "dotted") parts = [0, 1, 2, 3].map((i) => seg(i * (wk / 3.6), th));
  else parts = [seg(0, wk)];
  return html`<span style=${{ position: "relative", display: "inline-block", width: wk, height: th * 3, opacity, flex: "none" }}>${parts}</span>`;
}

function LinesTemplate({ s, f, w, h, t }) {
  const M = t.M, P = linesPlan(s, M);
  const u = Math.min(w, h) / 1080, fs = s.size * u, hx = s.position[1];
  const padX = (w * s.margin) / 100;
  const o = exitAt(s, f, t, 0);
  const W = Math.round((w - 2 * padX) * (s.chartWidth / 100));
  const H = Math.round(s.chartHeight * u);
  const ink = hex(s.labelColor);
  const fadeIn = prog(f, P.t0, M.enter);
  const all = P.series.flatMap((sr) => sr.values).filter((v) => v !== null);
  const lastVal = (sr) => { for (let j = sr.values.length - 1; j >= 0; j--) if (sr.values[j] !== null) return sr.values[j]; return 0; };
  const dataLo = Math.min(...all), dataHi = Math.max(...all);
  const decimals = all.some((v) => Math.round(v) !== v) ? 1 : 0;
  const fmt = (v) => `${s.prefix || ""}${fmtNum(v, decimals, true)}${s.suffix || ""}`;
  const scale = niceTicks(s.zero ? Math.min(0, dataLo) : dataLo - (dataHi - dataLo) * 0.1, dataHi, 4);
  const tickFmt = (v) => v === 0 ? "0" : `${s.prefix || ""}${Math.abs(scale.hi) >= 10000 ? fmtNum(v / 1000, 0, true) + "K" : fmtNum(v, decimals && Math.abs(scale.hi) < 100 ? 1 : 0, true)}${s.suffix || ""}`;
  const tickSize = fs * 0.78;
  const leftG = s.grid ? Math.max(...scale.ticks.map((v) => tickFmt(v).length)) * tickSize * 0.58 + fs * 0.6 : fs * 0.2;
  const labelText = (sr) => s.endLabels === "name" ? sr.name : s.endLabels === "value" ? fmt(lastVal(sr)) : s.endLabels === "both" ? `${sr.name}  ${fmt(lastVal(sr))}` : "";
  const endFs = fs * 0.85;
  const rightG = s.endLabels === "none" ? fs * 0.6 : Math.max(...P.series.map((sr) => labelText(sr).length), 4) * endFs * 0.56 + fs * 1.2;
  const plotW = Math.max(40, W - leftG - rightG), plotH = H;
  const X = (i) => leftG + (P.n > 1 ? (i / (P.n - 1)) * plotW : plotW / 2);
  const Y = (v) => plotH - ((v - scale.lo) / (scale.hi - scale.lo || 1)) * plotH;
  const focusIdx = s.focus && s.focus !== "none" ? P.series.findIndex((sr) => sr.name === s.focus) : -1;
  const lineW = Math.max(3, 4.5 * u);
  const styleOf = (i) => ({ color: hex(s[`c${i + 1}`] || "white"), dash: s[`d${i + 1}`] || "solid" });

  /* Each line's drawn part this frame, and its end point. */
  const lines = P.series.map((sr, i) => {
    const raw = sr.values.map((v, j) => (v === null ? null : { x: X(j), y: Y(v) })).filter(Boolean);
    const pts = sampleLine(raw, s.smooth);
    const p = prog(f, P.starts[i], P.drawF, LINE_EASE);
    const part = partialLine(pts, p);
    return { sr, i, raw, pts, p, part, ...styleOf(i), dim: focusIdx >= 0 && i !== focusIdx, focus: i === focusIdx };
  });

  /* End labels: start at each line's last point, then spread so none overlap; leader lines show any that moved. */
  const minGap = endFs * 1.3;
  const ends = lines.map((ln) => ({ i: ln.i, target: ln.raw[ln.raw.length - 1].y, y: ln.raw[ln.raw.length - 1].y, x: ln.raw[ln.raw.length - 1].x }));
  const sorted = [...ends].sort((a, b) => a.target - b.target);
  for (let k = 1; k < sorted.length; k++) sorted[k].y = Math.max(sorted[k].y, sorted[k - 1].y + minGap);
  const overflow = sorted.length ? sorted[sorted.length - 1].y - plotH : 0;
  if (overflow > 0) for (const e of sorted) e.y -= overflow;
  for (let k = sorted.length - 2; k >= 0; k--) sorted[k].y = Math.min(sorted[k].y, sorted[k + 1].y - minGap);

  const ref = useRef(null);
  useLayoutEffect(() => {
    const c = ref.current;
    if (!c) return;
    const x = c.getContext("2d");
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.clearRect(0, 0, c.width, c.height);
    if (s.grid) {
      x.strokeStyle = ink; x.globalAlpha = 0.18 * fadeIn; x.lineWidth = Math.max(1, 1.5 * u);
      for (const v of scale.ticks) { const yy = Math.round(Y(v)) + 0.5; x.beginPath(); x.moveTo(leftG, yy); x.lineTo(leftG + plotW * fadeIn, yy); x.stroke(); }
      x.globalAlpha = 1;
    }
    for (const ln of lines) {
      if (ln.p <= 0) continue;
      const alpha = ln.dim ? 0.45 : 1;
      const width = ln.focus ? lineW * 1.35 : ln.dim ? lineW * 0.85 : lineW;
      if (s.area && (ln.focus || (focusIdx < 0 && ln.i === 0)) && ln.part.pts.length > 1) {
        x.beginPath();
        x.moveTo(ln.part.pts[0].x, Y(Math.max(scale.lo, 0)));
        for (const pt of ln.part.pts) x.lineTo(pt.x, pt.y);
        x.lineTo(ln.part.end.x, Y(Math.max(scale.lo, 0)));
        x.closePath();
        x.globalAlpha = 0.12; x.fillStyle = ln.color; x.fill(); x.globalAlpha = 1;
      }
      x.beginPath();
      ln.part.pts.forEach((pt, k) => (k ? x.lineTo(pt.x, pt.y) : x.moveTo(pt.x, pt.y)));
      x.globalAlpha = alpha; x.strokeStyle = ln.color; x.lineWidth = width; x.lineJoin = "round"; x.lineCap = "round";
      x.setLineDash(DASHES[ln.dash].map((d) => d * u * (ln.dash === "dotted" ? 1 : 1)));
      x.stroke(); x.setLineDash([]);
      if (s.markers) {
        x.fillStyle = ln.color;
        for (const pt of ln.raw) if (pt.x <= ln.part.end.x + 0.5) { x.beginPath(); x.arc(pt.x, pt.y, Math.max(4, 5 * u), 0, Math.PI * 2); x.fill(); }
      }
      x.fillStyle = ln.color; x.beginPath(); x.arc(ln.part.end.x, ln.part.end.y, Math.max(5, (ln.focus ? 8 : 6.5) * u), 0, Math.PI * 2); x.fill();
      x.globalAlpha = 1;
      const e = ends.find((q) => q.i === ln.i);
      if (s.endLabels !== "none" && ln.p >= 1 && Math.abs(e.y - e.target) > 2) {
        x.strokeStyle = ink; x.globalAlpha = 0.45; x.lineWidth = Math.max(1, 1.5 * u);
        x.beginPath(); x.moveTo(e.x + 9 * u, e.target); x.lineTo(e.x + fs * 0.75, e.y); x.stroke(); x.globalAlpha = 1;
      }
    }
  });

  const legendOn = s.legend && P.series.length > 1;
  return html`<${Frame} s=${s} w=${w} h=${h} pos=${s.position}>
    <div style=${{ display: "flex", flexDirection: "column", alignItems: ITEMS[hx], opacity: 1 - o, transform: `translateY(${-o * fs * 0.4}px)` }}>
      ${P.headOn && html`<div style=${{ fontFamily: FONT.serif, fontWeight: 500, fontSize: fs * 1.6, lineHeight: 1.08, letterSpacing: "-0.015em", color: hex(s.headingColor), marginBottom: fs * 0.7, textAlign: ALIGN[hx], textWrap: "balance", maxWidth: W }}>
        <${HighlightText} L=${planLines(s.heading, "words", 0, M)} entrance="words" f=${f} M=${M} o=${0} accentStyle=${accentStyleFor(s, "c1")} />
      </div>`}
      ${legendOn && html`<div style=${{ display: "flex", flexWrap: "wrap", gap: `${fs * 0.35}px ${fs * 1.1}px`, marginBottom: fs * 0.8, width: W, paddingLeft: leftG, justifyContent: "flex-start", opacity: fadeIn }}>
        ${lines.map((ln) => html`<span key=${ln.i} style=${{ display: "inline-flex", alignItems: "center", gap: fs * 0.4, fontFamily: FONT.sans, fontSize: fs * 0.8, color: ink, opacity: ln.dim ? 0.7 : 1 }}>
          <${LineKey} style=${ln.dash} color=${ln.color} u=${u} opacity=${ln.dim ? 0.45 : 1} />${ln.sr.name || `Line ${ln.i + 1}`}</span>`)}
      </div>`}
      <div style=${{ position: "relative", width: W, height: H + fs * 1.6 }}>
        <canvas ref=${ref} width=${W} height=${H} style=${{ position: "absolute", left: 0, top: 0, width: W, height: H }}></canvas>
        ${s.grid && scale.ticks.map((v, k) => html`<div key=${"t" + k} style=${{ position: "absolute", left: 0, width: leftG - fs * 0.5, top: Y(v) - tickSize * 0.65, textAlign: "right", fontFamily: FONT.sans, fontSize: tickSize, lineHeight: 1.3, color: ink, opacity: 0.6 * fadeIn }}>${tickFmt(v)}</div>`)}
        ${Array.from({ length: P.n }, (_, j) => P.xs[j] ? html`<div key=${"x" + j} style=${{ position: "absolute", left: X(j) - 200, width: 400, top: H + fs * 0.45, textAlign: "center", fontFamily: FONT.sans, fontSize: tickSize, lineHeight: 1.3, color: ink, opacity: 0.75 * fadeIn }}>${P.xs[j]}</div>` : null)}
        ${s.endLabels !== "none" && lines.map((ln) => { const e = ends.find((q) => q.i === ln.i); const lp = prog(f, P.starts[ln.i] + P.drawF - 4, Math.round(M.enter * 0.6));
          const val = fmt(lastVal(ln.sr));
          return html`<div key=${"e" + ln.i} style=${{ position: "absolute", left: e.x + fs * 0.8, top: e.y - endFs * 0.65, whiteSpace: "nowrap", fontFamily: FONT.sans, fontSize: endFs, lineHeight: 1.3, color: ink, opacity: lp * (ln.dim ? 0.7 : 1), transform: `translateX(${(1 - lp) * -8 * u}px)` }}>
            ${s.endLabels !== "value" && html`<span style=${{ fontWeight: 600 }}>${ln.sr.name}</span>`}${s.endLabels === "both" && html`<span style=${{ opacity: 0.75 }}>  ${val}</span>`}${s.endLabels === "value" && html`<span style=${{ fontWeight: 600 }}>${val}</span>`}
          </div>`; })}
      </div>
    </div>
  </${Frame}>`;
}

/* --------------------------------------------------------------- template registry */

const SHARED_DEFAULTS = { ratio: "16:9", background: "transparent", bgColor: "deep-forest", inPace: 1, hold: 3, outSec: 0.56, animateOut: true };
const FORMAT_CONTROLS = [

const downloadsReady = (async () => {
  try { return window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch { return null; }
})();

async function saveFile(filename, blob) {
  const dl = await downloadsReady;
  if (dl) {
    try { await dl.save({ filename, data: blob }); return { ok: true }; }
    catch (e) { return { ok: false, code: (e && e.code) || "unavailable" }; }
  }
  if (!window.claude) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    return { ok: true };
  }
  return { ok: false, code: "unavailable" };
}
/* Hosted outside claude.ai (an ordinary web page): no Claude capabilities, so Export makes the ProRes .mov in the
   browser with FFmpeg (vendor/ffmpeg, served next to the page) and downloads it like any website. */
const HOSTED = !(window.claude && typeof window.claude.use === "function");
/* The hosted copy (GitHub Pages, repo robertrusch/overlay-studio): inside claude.ai the .mov is made there. */
const WEB_URL = "https://robertrusch.github.io/overlay-studio/";
let ffmpegPromise = null;
/* The encoder's 31 MB .wasm is stored in four parts of about 8 MB, so it can be uploaded to
   GitHub through the browser; they're joined into one blob before loading. */
const FFMPEG_WASM_PARTS = [1, 2, 3, 4].map((n) => `ffmpeg-core.wasm.part${n}`);
function getFFmpeg() {
  if (!ffmpegPromise) {
    ffmpegPromise = (async () => {
      const at = (path) => new URL("vendor/ffmpeg/" + path, location.href).href;
      const { FFmpeg } = await import(at("ffmpeg/index.js"));
      const parts = await Promise.all(FFMPEG_WASM_PARTS.map(async (name) => {
        const r = await fetch(at("core/" + name));
        if (!r.ok) throw new Error(`Couldn't load the encoder (${name}: ${r.status}).`);
        return r.arrayBuffer();
      }));
      const wasmURL = URL.createObjectURL(new Blob(parts, { type: "application/wasm" }));
      const ff = new FFmpeg();
      try { await ff.load({ coreURL: at("core/ffmpeg-core.js"), wasmURL }); }
      finally { URL.revokeObjectURL(wasmURL); }
      return ff;
    })();
    ffmpegPromise.catch(() => { ffmpegPromise = null; });
  }
  return ffmpegPromise;
}

   version 0, where Apple ignores alpha, and it leaves out the closing bit after a slice's last
   alpha value, which makes Apple reject the frame. appleProRes() rewrites every frame the way
   Apple's own encoder does (version 1, BT.709 tags, each slice's alpha coded with Apple's
   choices, the bottom half-row coded for its visible lines only) and rebuilds the .mov around
   them, adding a BT.709 colr atom when FFmpeg left it out. */

    if (fh[12] & 0x0c) throw new Error("Expected progressive ProRes");
    fh[2] = 0; fh[3] = 1;                 // bitstream version 1: Apple reads alpha only here
    fh[14] = fh[15] = fh[16] = 1;         // BT.709 primaries, transfer and matrix
    const p = 8 + hs, phs = f[p] >> 3;
    const ph = f.slice(p, p + phs);
    const n = rd16(f, p + 5), log2w = f[p + 7] >> 4;
    if (f[p + 7] & 15) throw new Error("Unexpected slice height");
    const wmb = (width + 15) >> 4;
    const parts = [];
    let total = 0, o = p + phs + 2 * n, x = 0, y = 0;
    for (let k = 0; k < n; k++) {
      let mbs = 1 << log2w;
      while (x + mbs > wmb) mbs >>= 1;
      const size = rd16(f, p + phs + 2 * k);
      const sh = f[o] >> 3;
      if (sh < 8) throw new Error("Unexpected slice header");
      const a0 = o + sh + rd16(f, o + 2) + rd16(f, o + 4) + rd16(f, o + 6);
      decodeAlpha(f, a0, o + size, mbs * 256);
      const rows = Math.min(16, height - y * 16);
      const alpha = encodeAlpha(mbs * 16 * rows);
      const head = f.subarray(o, a0);
      parts.push(head, alpha);
      total += head.length + alpha.length;
      o += size; x += mbs;
      if (x >= wmb) { x = 0; y++; }
    }
    const body = 8 + hs + phs + 2 * n + total;
    const frame = new Uint8Array(body);
    wr32(frame, 0, body);
    frame.set([0x69, 0x63, 0x70, 0x66], 4);
    frame.set(fh, 8);
    wr32(ph, 1, phs + 2 * n + total);
    frame.set(ph, 8 + hs);
    let q = 8 + hs + phs;
    for (let k = 0; k < n; k++) {
      const len = parts[2 * k].length + parts[2 * k + 1].length;
      frame[q++] = len >> 8; frame[q++] = len & 255;
    }
    for (const part of parts) { frame.set(part, q); q += part.length; }
    return frame;
  };

  /* --- rewrite every frame, keeping FFmpeg's chunk layout --- */
  const frames = [];
  let k = 0;
  for (let c = 0; c < chunks; c++) {
    let o = offsets[c];
    for (let j = 0; j < perChunk[c]; j++, k++) {
      frames.push(fixFrame(mov.subarray(o, o + sizes[k])));
      o += sizes[k];
      if (onProgress) onProgress(k + 1, count);
      if (k % 4 === 3) await new Promise((r) => setTimeout(r, 0)); // let the progress bar paint
    }
  }

  /* --- sample tables, colr atom, then the new file --- */
  const box = (type, payload) => {
    const b = new Uint8Array(8 + payload.length);
    wr32(b, 0, b.length); b.set([...type].map((ch) => ch.charCodeAt(0)), 4); b.set(payload, 8);
    return b;
  };
  const newStsz = new Uint8Array(12 + 4 * count);
  wr32(newStsz, 8, count);
  frames.forEach((fr, i) => wr32(newStsz, 12 + 4 * i, fr.length));
  get(stbl, "stsz").bytes = box("stsz", newStsz);
  const headLen = mdat.start + 8;
  const newStco = stco.bytes.slice();
  let pos = headLen; k = 0;
  for (let c = 0; c < chunks; c++) {
    wr32(newStco, 16 + 4 * c, pos);
    for (let j = 0; j < perChunk[c]; j++, k++) pos += frames[k].length;
  }
  stco.bytes = newStco;
  const stsdNode = get(stbl, "stsd");
  const stsd = stsdNode.bytes;
  if (rd32(stsd, 12) === 1) {
    const entry = stsd.subarray(16, rd32(stsd, 0));
    const entryKids = boxes(entry, 86, entry.length);
    if (!entryKids.some((x) => x.type === "colr")) {
      const colr = box("colr", new Uint8Array([0x6e, 0x63, 0x6c, 0x63, 0, 1, 0, 1, 0, 1]));
      const newEntry = new Uint8Array(entry.length + colr.length);
      newEntry.set(entry.subarray(0, 86)); newEntry.set(colr, 86); newEntry.set(entry.subarray(86), 86 + colr.length);
      wr32(newEntry, 0, newEntry.length);
      stsdNode.bytes = box("stsd", new Uint8Array([...stsd.subarray(8, 16), ...newEntry]));
    }
  }
  const serialise = (node) => {
    if (!node.kids) return node.bytes;
    const kids = node.kids.map(serialise);
    const len = 8 + kids.reduce((s, b) => s + b.length, 0);
    const b = new Uint8Array(len);
    wr32(b, 0, len); b.set([...node.type].map((ch) => ch.charCodeAt(0)), 4);
    let q = 8;
    for (const kb of kids) { b.set(kb, q); q += kb.length; }
    return b;
  };
  const moovBytes = serialise(tree);
  const mdatLen = 8 + frames.reduce((s, fr) => s + fr.length, 0);
  const file = new Uint8Array(mdat.start + mdatLen + moovBytes.length);
  file.set(mov.subarray(0, mdat.start));
  wr32(file, mdat.start, mdatLen);
  file.set([0x6d, 0x64, 0x61, 0x74], mdat.start + 4);
  let q = headLen;
  for (const fr of frames) { file.set(fr, q); q += fr.length; }
  file.set(moovBytes, q);
  return file;
}

function hasFont(name) {
  const c = document.createElement("canvas").getContext("2d");
  const sample = "Hamburgefonstiv 0123456789";
  return ["monospace", "serif", "sans-serif"].some((fb) => {
    c.font = `40px ${fb}`; const a = c.measureText(sample).width;
    c.font = `40px "${name}", ${fb}`; return Math.abs(c.measureText(sample).width - a) > 0.5;
  });
}
function useFontStatus() {
  const [st, setSt] = useState(null);
  useEffect(() => {
    let alive = true;
    (async () => {
      try { await document.fonts.ready; } catch {}
      await new Promise((r) => setTimeout(r, 250));
      if (alive) setSt({ serif: hasFont("P22 Mackinac Pro"), sans: hasFont("Helvetica Neue") });
    })();
    return () => { alive = false; };
  }, []);
  return st;
}
