function NumberField({ id, value, onCommit }) {
  const [txt, setTxt] = useState(String(value));
  useEffect(() => { if (parseFloat(String(txt).replace(/,/g, "")) !== Number(value)) setTxt(String(value)); }, [value]);
  return html`<input id=${id} className="input" inputMode="decimal" autoComplete="off" value=${txt}
    onChange=${(e) => { const v = e.target.value; setTxt(v); const n = parseFloat(v.replace(/,/g, "")); if (Number.isFinite(n)) onCommit(n); }} />`;
}

function Control({ c, s, set, ctx }) {
  const v = s[c.key];
  const id = "f-" + c.key;
  const cls = "field" + (c.half ? " half" : "");
  const hint = c.hint ? html`<div className="hint">${c.hint}</div>` : null;
  switch (c.type) {
    case "text":
      return html`<div className=${cls}><label className="label" htmlFor=${id}>${c.label}</label>
        <input id=${id} className="input" type="text" autoComplete="off" maxLength=${c.max || 120} placeholder=${c.placeholder || ""} value=${v ?? ""} onChange=${(e) => set(c.key, e.target.value)} />${hint}</div>`;
    case "textarea":
      return html`<div className=${cls}><label className="label" htmlFor=${id}>${c.label}</label>
        <textarea id=${id} className="textarea" rows=${c.rows || 2} maxLength=${400} value=${v ?? ""} onChange=${(e) => set(c.key, e.target.value)}></textarea>${hint}</div>`;
    case "number":
      return html`<div className=${cls}><label className="label" htmlFor=${id}>${c.label}</label><${NumberField} id=${id} value=${v} onCommit=${(n) => set(c.key, n)} />${hint}</div>`;
    case "slider": {
      const pct = ((Number(v) - c.min) / (c.max - c.min)) * 100;
      const shown = c.step < 0.1 ? Number(v).toFixed(2) : c.step < 1 ? Number(v).toFixed(1) : Math.round(Number(v));
      return html`<div className=${cls}><div className="label"><label htmlFor=${id}>${c.label}</label><span className="val">${shown}${c.unit === "%" ? "%" : " " + c.unit}</span></div>
        <input id=${id} type="range" min=${c.min} max=${c.max} step=${c.step} value=${v} style=${{ "--pct": `${pct}%` }} onChange=${(e) => set(c.key, parseFloat(e.target.value))} />${hint}</div>`;
    }
    case "switch":
      return html`<div className="field inline"><label className="label" htmlFor=${id}>${c.label}</label>
        <button id=${id} type="button" role="switch" aria-checked=${v ? "true" : "false"} className="switch" onClick=${() => set(c.key, !v)}></button></div>`;
    case "segmented":
      return html`<div className=${cls}><div className="label">${c.label}</div>
        <div className="seg" role="group" aria-label=${c.label}>${c.options.map(([val, lab]) =>
          html`<button key=${val} type="button" aria-pressed=${v === val ? "true" : "false"} onClick=${() => set(c.key, val)}>${lab}</button>`)}</div>${hint}</div>`;
    case "select":
      return html`<div className=${c.wide ? cls : "field inline"}><label className="label" htmlFor=${id}>${c.label}</label>
        <select id=${id} className="select" style=${c.wide ? { width: "100%" } : null} value=${v} onChange=${(e) => set(c.key, e.target.value)}>${c.options.map(([val, lab]) =>
          html`<option key=${val} value=${val}>${lab}</option>`)}</select></div>`;
    case "swatch":
      return html`<div className=${cls}><div className="label">${c.label}<span className="val">${swatchName(v)}</span></div>
        <div className="swatches" role="radiogroup" aria-label=${c.label}>${SWATCHES.map((sw) =>
          html`<button key=${sw.id} type="button" role="radio" aria-checked=${v === sw.id ? "true" : "false"} aria-label=${sw.name} title=${sw.name} className="sw" style=${{ background: sw.hex }} onClick=${() => set(c.key, sw.id)}></button>`)}</div>${hint}</div>`;
    case "position": {
      const cells = ["tl", "tc", "tr", "ml", "mc", "mr", "bl", "bc", "br"];
      return html`<div className=${cls}><div className="label">${c.label}</div><div className="pos-wrap">
        <div className="pos" role="radiogroup" aria-label=${c.label}>${cells.map((p) => {
          const ok = !c.allowed || c.allowed.includes(p);
          return html`<button key=${p} type="button" role="radio" aria-checked=${v === p ? "true" : "false"} aria-label=${POS_NAMES[p]} title=${POS_NAMES[p]} disabled=${!ok} onClick=${() => set(c.key, p)}></button>`;
        })}</div><span className="pos-label">${POS_NAMES[v] || ""}</span></div></div>`;
    }
    case "itemSelect": {
      const opts = listItems(s[c.from]);
      return html`<div className=${cls}><label className="label" htmlFor=${id}>${c.label}</label>
        <select id=${id} className="select" style=${{ width: "100%" }} value=${opts.includes(v) ? v : ""} onChange=${(e) => set(c.key, e.target.value)}>
          <option value="">First in the list</option>${opts.map((o, i) => html`<option key=${i} value=${o}>${o}</option>`)}</select></div>`;
    }
    case "barSelect": {
      const labels = parseBars(s[c.from]).map((b) => b.label);
      const val = v === "max" || v === "none" || labels.includes(v) ? v : "max";
      return html`<div className=${cls}><label className="label" htmlFor=${id}>${c.label}</label>
        <select id=${id} className="select" style=${{ width: "100%" }} value=${val} onChange=${(e) => set(c.key, e.target.value)}>
          <option value="max">The largest bar</option><option value="none">No highlight</option>${labels.map((l, i) => html`<option key=${i} value=${l}>${l}</option>`)}</select></div>`;
    }
    case "pinsStatus": {
      const { unknown } = parsePins(s[c.from]);
      if (!unknown.length) return null;
      return html`<div className="readout warn"><span>Not on the map: ${unknown.join(", ")}</span></div>`;
    }
    case "pinSelect": {
      const labels = parsePins(s[c.from]).pins.map((p) => p.label);
      const val = labels.includes(v) ? v : "none";
      return html`<div className=${cls}><label className="label" htmlFor=${id}>${c.label}</label>
        <select id=${id} className="select" style=${{ width: "100%" }} value=${val} onChange=${(e) => set(c.key, e.target.value)}>
          <option value="none">No hub</option>${labels.map((l, i) => html`<option key=${i} value=${l}>${l}</option>`)}</select>${hint}</div>`;
    }
    case "seriesSelect": {
      const names = parseLineData(s).series.map((sr) => sr.name).filter(Boolean);
      const val = names.includes(v) ? v : "none";
      return html`<div className=${cls}><label className="label" htmlFor=${id}>${c.label}</label>
        <select id=${id} className="select" style=${{ width: "100%" }} value=${val} onChange=${(e) => set(c.key, e.target.value)}>
          <option value="none">No focus line</option>${names.map((l, i) => html`<option key=${i} value=${l}>${l}</option>`)}</select>${hint}</div>`;
    }
    case "places": return html`<${PlacesControl} c=${c} s=${s} set=${set} ctx=${ctx} />`;
    case "wheelItems": return html`<${WheelItemsControl} c=${c} s=${s} set=${set} setMany=${ctx.setMany} />`;
    case "placeSearch": return html`<${PlaceSearchControl} c=${c} s=${s} set=${set} setMany=${ctx.setMany} ctx=${ctx} />`;
    case "rows": return html`<${RowsControl} c=${c} s=${s} setMany=${ctx.setMany} />`;
    case "lineGrid": return html`<${LineGridControl} s=${s} setMany=${ctx.setMany} />`;
    case "inPhase": {
      const { T, t, setPhase } = ctx;
      const [mn, mx] = inRange(T, s);
      const val = t.inF / FPS, lo = mn / FPS, hi = Math.max(mx, mn + 1) / FPS;
      const pct = ((val - lo) / (hi - lo)) * 100;
      return html`<div className=${cls}><div className="label"><label htmlFor=${id}>${c.label}</label><span className="val">${val.toFixed(2)} s</span></div>
        <input id=${id} type="range" min=${lo} max=${hi} step=${1 / FPS} value=${val} disabled=${mx <= mn} style=${{ "--pct": `${pct}%` }}
          onChange=${(e) => setPhase("in", Math.round(parseFloat(e.target.value) * FPS))} /></div>`;
    }
    default: return null;
  }
}

/* Proper editors for the list-shaped settings. They read and write the same text the templates already
   use ("Label | value" lines and so on), so templates and saved presets don't change. */

const normText = (str) => String(str).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const flagSrcFor = (code) => { const c = code === "uk" ? "gb" : String(code || "").toLowerCase(); return FLAG_SVGS[c] ? "data:image/svg+xml;charset=utf-8," + encodeURIComponent(FLAG_SVGS[c]) : null; };
const PLACE_PICKS = Object.keys(PLACES).map((k) => ({ value: k, label: k, code: k.split(",").pop().trim().toLowerCase() }));
const moveItem = (arr, from, to) => { const a = arr.slice(); const [x] = a.splice(from, 1); a.splice(to, 0, x); return a; };
const unmerc = (x, y) => ({ lng: (x / MAP_WORLD) * 360 - 180, lat: (180 / Math.PI) * Math.atan(Math.sinh(Math.PI * (1 - (2 * y) / MAP_WORLD))) });
const fmtCoord = (v) => (Math.round(v * 10000) / 10000).toString();

function useOutside(ref, onOut, active) {
  useEffect(() => {
    if (!active) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onOut(); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [active]);
}

/* Search box with a suggestion list. Arrow keys move, Enter picks, Escape closes. */
function Combo({ id, placeholder, options, onPick, freeLabel }) {
  const [q, setQ] = useState(""), [open, setOpen] = useState(false), [hi, setHi] = useState(0);
  const ref = useRef(null);
  useOutside(ref, () => setOpen(false), open);
  const nq = normText(q.trim());
  const list = options.filter((o) => !nq || normText(o.label).includes(nq)).slice(0, 60);
  const free = freeLabel && q.trim() && !options.some((o) => normText(o.label) === nq) ? [{ value: q.trim(), label: `${freeLabel} “${q.trim()}”`, free: true }] : [];
  const items = [...list, ...free];
  const choose = (o) => { onPick(o); setQ(""); setHi(0); };
  return html`<div className="combo" ref=${ref}>
    <input id=${id} className="input" placeholder=${placeholder} value=${q} autoComplete="off" role="combobox" aria-expanded=${open ? "true" : "false"}
      onFocus=${() => setOpen(true)} onChange=${(e) => { setQ(e.target.value); setOpen(true); setHi(0); }}
      onKeyDown=${(e) => {
        if (e.key === "ArrowDown") { e.preventDefault(); setOpen(true); setHi((x) => Math.min(items.length - 1, x + 1)); }
        else if (e.key === "ArrowUp") { e.preventDefault(); setHi((x) => Math.max(0, x - 1)); }
        else if (e.key === "Enter") { e.preventDefault(); if (open && items[hi]) choose(items[hi]); }
        else if (e.key === "Escape") setOpen(false);
      }} />
    ${open && items.length > 0 && html`<div className="combo-menu" role="listbox">${items.map((o, i) => html`<div key=${o.value + "|" + i} role="option" aria-selected=${i === hi ? "true" : "false"} className=${"combo-opt" + (o.free ? " free" : "")}
        onMouseDown=${(e) => { e.preventDefault(); choose(o); }} onMouseEnter=${() => setHi(i)}>
        ${flagSrcFor(o.code) ? html`<img src=${flagSrcFor(o.code)} alt="" />` : html`<span className="noflag"></span>`}<span>${o.label}</span></div>`)}</div>`}
  </div>`;
}

/* Chips you can drag to reorder; clicking one opens its menu. */
function ChipList({ items, onMove, menuFor, emptyText }) {
  const [drag, setDrag] = useState(null), [over, setOver] = useState(null), [menu, setMenu] = useState(null);
  const ref = useRef(null);
  useOutside(ref, () => setMenu(null), menu !== null);
  return html`<div className="chips" ref=${ref}>
    ${items.length ? items.map((it, i) => html`<div key=${it.key} className=${"chip" + (it.warn ? " warn" : "") + (drag === i ? " dragging" : "") + (over === i && drag !== null && drag !== i ? " over" : "")}
        draggable="true"
        onDragStart=${(e) => { setDrag(i); setMenu(null); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", String(i)); } catch {} }}
        onDragOver=${(e) => { e.preventDefault(); if (over !== i) setOver(i); }}
        onDrop=${(e) => { e.preventDefault(); if (drag !== null && drag !== i) onMove(drag, i); setDrag(null); setOver(null); }}
        onDragEnd=${() => { setDrag(null); setOver(null); }}>
        <button type="button" className="chip-main" title=${it.title || "Drag to reorder, click for options"} aria-haspopup="menu" aria-expanded=${menu === i ? "true" : "false"} onClick=${() => setMenu(menu === i ? null : i)}>
          ${flagSrcFor(it.code) && html`<img src=${flagSrcFor(it.code)} alt="" />`}<span className="chip-label">${it.label}</span>${(it.badges || []).map((b) => html`<span key=${b} className="chip-badge">${b}</span>`)}
        </button>
        ${menu === i && html`<div className="pop-menu" role="menu">${menuFor(it, i, () => setMenu(null))}</div>`}
      </div>`) : html`<span className="chips-empty">${emptyText}</span>`}
  </div>`;
}

function MenuItem({ onClick, children, danger, disabled }) {

/* ---- places for Map pins: known places by name, others as "Label, CC | lat, lng" */
function parsePinLine(line) {
  const [name, coords] = line.split("|").map((x) => x.trim());
  if (coords !== undefined) {
    const m = coords.match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
    if (m && name) return { label: name.split(",")[0].trim(), lat: +m[1], lng: +m[2], code: (name.split(",")[1] || "").trim().toLowerCase(), key: null };
  }
  const key = placeKey(name);
  return key ? { label: key.split(",")[0], lat: PLACES[key][0], lng: PLACES[key][1], code: key.split(",").pop().trim().toLowerCase(), key } : null;
}
const customLine = (label, code, lat, lng) => `${label}${code ? ", " + code.toUpperCase() : ""} | ${fmtCoord(lat)}, ${fmtCoord(lng)}`;

function CustomPlaceForm({ onAdd, startPick, idBase }) {
  const [f, setF] = useState({ name: "", code: "", lat: "", lng: "" });
  const lat = parseFloat(f.lat), lng = parseFloat(f.lng);
  const ok = f.name.trim() && Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 85 && Math.abs(lng) <= 180;
  return html`<div className="custom-place">
    <div className="cp-row"><input id=${idBase + "-name"} className="input" placeholder="Name" maxLength=${40} value=${f.name} onChange=${(e) => setF({ ...f, name: e.target.value })} aria-label="Place name" />
      <select className="select" value=${f.code} onChange=${(e) => setF({ ...f, code: e.target.value })} aria-label="Flag"><option value="">No flag</option>${FLAG_OPTIONS.map(([k, n]) => html`<option key=${k} value=${k}>${n}</option>`)}</select></div>
    <div className="cp-row"><input className="input" placeholder="Latitude" inputMode="decimal" value=${f.lat} onChange=${(e) => setF({ ...f, lat: e.target.value })} aria-label="Latitude" />
      <input className="input" placeholder="Longitude" inputMode="decimal" value=${f.lng} onChange=${(e) => setF({ ...f, lng: e.target.value })} aria-label="Longitude" /></div>
    <div className="cp-row">
      <button type="button" className="btn" onClick=${() => startPick(`Click the map to place ${f.name.trim() || "the new place"}`, (la, ln) => setF((x) => ({ ...x, lat: fmtCoord(la), lng: fmtCoord(ln) })))}><${Icon} d=${IC.pin} size=${14} />Pick on the map</button>
      <button type="button" className="btn primary" disabled=${!ok} onClick=${() => { onAdd(customLine(f.name.trim(), f.code, lat, lng)); setF({ name: "", code: "", lat: "", lng: "" }); }}>Add place</button>
    </div>
  </div>`;
}

function PlacesControl({ c, s, set, ctx }) {

      menuFor=${(it, i, close) => html`

        ${it.p && html`<${RenameRow} initial=${it.p.label} onSave=${(v) => { const next = lines.slice(); next[i] = customLine(v, it.p.code, it.p.lat, it.p.lng); write(next); if (s.hub === it.p.label) set("hub", v); close(); }} />`}
        <${MenuItem} disabled=${i === 0} onClick=${() => { write(moveItem(lines, i, i - 1)); close(); }}>Move earlier</${MenuItem}>
        <${MenuItem} disabled=${i === lines.length - 1} onClick=${() => { write(moveItem(lines, i, i + 1)); close(); }}>Move later</${MenuItem}>

      : html`<button type="button" className="link-btn" onClick=${() => setAdding(true)}>+ Add a place that isn't listed</button>`}
    <div className="hint">Drag to set the order they appear in. Click a place to make it the hub, rename it or remove it.</div>
  </div>`;
}

const ROW_EDITORS = {
  bars: { label: "Bars", add: "Add a bar", min: 1, max: 8,
    fields: [{ k: "label", ph: "Label", w: 3 }, { k: "value", ph: "Value", w: 2 }],

  stats: { label: "Stats", add: "Add a stat", min: 2, max: 4,
    fields: [{ k: "value", ph: "12,500+", w: 2 }, { k: "label", ph: "Label", w: 3 }],
    parse: (s) => Array.from({ length: clamp(Number(s.count) || 3, 2, 4) }, (_, i) => ({ value: s[`n${i + 1}`] || "", label: s[`l${i + 1}`] || "" })),
    write: (rows) => { const out = { count: String(rows.length) }; rows.forEach((r, i) => { out[`n${i + 1}`] = r.value; out[`l${i + 1}`] = r.label; }); return out; } },
  points: { label: "Points", add: "Add a point", min: 1, max: 6,

  steps: { label: "Steps", add: "Add a step", min: 1, max: 6,

    parse: (s) => parseSteps(s.steps).map((x) => ({ label: x.label, detail: x.detail })),
    write: (rows) => ({ steps: rows.map((r) => (r.detail.trim() ? `${r.label} | ${r.detail}` : r.label)).join("\n") }) },
};

function RowsControl({ c, s, setMany }) {
  const E = ROW_EDITORS[c.editor];
  const blank = () => Object.fromEntries(E.fields.map((fd) => [fd.k, ""]));
  const ext = JSON.stringify(E.write(E.parse(s)));
  const last = useRef(null);
  const [rows, setRows] = useState(() => E.parse(s));
  useEffect(() => { if (ext !== last.current) { setRows(E.parse(s)); last.current = ext; } }, [ext]);
  const commit = (next) => { setRows(next); const out = E.write(next); last.current = JSON.stringify(E.write(E.parse({ ...s, ...out }))); setMany(out); };
  const [drag, setDrag] = useState(null), [over, setOver] = useState(null);
  const onPaste = (i, fi) => (e) => {
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if (!/[\t\n]/.test(text)) return;
    e.preventDefault();
    const pasted = text.replace(/\r/g, "").split("\n").filter((l) => l.trim()).map((l) => {
      const cells = l.includes("\t") ? l.split("\t") : l.split("|");
      const r = blank();
      if (E.fields.length === 1) r[E.fields[0].k] = cells.join(" ").trim();
      else E.fields.forEach((fd, k) => { r[fd.k] = (cells[k] || "").trim(); });
      return r;
    });
    const next = rows.slice(0, i).concat(pasted, rows.slice(i + 1)).slice(0, E.max);
    commit(next);
  };
  const cols = E.fields.map((fd) => `${fd.w}fr`).join(" ");
  return html`<div className="field">
    <div className="label">${c.label || E.label}<span className="val">${rows.length} of ${E.max}</span></div>
    <div className="rows">
      ${rows.map((r, i) => html`<div key=${i} className=${"rowed" + (drag === i ? " dragging" : "") + (over === i && drag !== null && drag !== i ? " over" : "")} style=${{ gridTemplateColumns: `18px ${cols} 26px` }}
          onDragOver=${(e) => { if (drag === null) return; e.preventDefault(); if (over !== i) setOver(i); }}
          onDrop=${(e) => { e.preventDefault(); if (drag !== null && drag !== i) commit(moveItem(rows, drag, i)); setDrag(null); setOver(null); }}>
        <span className="handle" draggable="true" title="Drag to reorder" aria-hidden="true"
          onDragStart=${(e) => { setDrag(i); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", String(i)); } catch {} }}
          onDragEnd=${() => { setDrag(null); setOver(null); }}>⋮⋮</span>
        ${E.fields.map((fd, fi) => html`<input key=${fd.k} className="input" placeholder=${fd.ph} value=${r[fd.k]} maxLength=${90} aria-label=${`${fd.ph} ${i + 1}`}
          onChange=${(e) => { const next = rows.slice(); next[i] = { ...r, [fd.k]: e.target.value }; commit(next); }} onPaste=${onPaste(i, fi)} />`)}
        <button type="button" className="row-x" aria-label=${`Remove row ${i + 1}`} disabled=${rows.length <= E.min} onClick=${() => commit(rows.filter((_, j) => j !== i))}>×</button>
      </div>`)}
    </div>
    <div className="row" style=${{ justifyContent: "space-between" }}>
      <button type="button" className="link-btn" disabled=${rows.length >= E.max} onClick=${() => commit([...rows, blank()])}>+ ${E.add}</button>
      <span className="hint" style=${{ whiteSpace: "nowrap" }}>You can paste from a spreadsheet</span>
    </div>
    ${c.hint && html`<div className="hint">${c.hint}</div>`}
  </div>`;
}

/* ---- Line graph: a small spreadsheet, one row per line, one column per point */
function LineGridControl({ s, setMany }) {
  const parse = (st) => {
    const points = String(st.points || "").split(",").map((x) => x.trim());
    const rows = String(st.series || "").split("\n").map((x) => x.trim()).filter(Boolean).slice(0, 4).map((line) => {
      const bar = line.indexOf("|");
      return { name: bar >= 0 ? line.slice(0, bar).trim() : "", values: (bar >= 0 ? line.slice(bar + 1) : line).split(/[,;]/).map((v) => v.trim()) };
    });
    const n = Math.max(points.filter(Boolean).length, ...rows.map((r) => r.values.length), 1);
    return { points: Array.from({ length: n }, (_, j) => points[j] || ""), rows: rows.map((r) => ({ ...r, values: Array.from({ length: n }, (_, j) => r.values[j] || "") })),
      styles: [0, 1, 2, 3].map((i) => ({ c: st[`c${i + 1}`] || "white", d: st[`d${i + 1}`] || "solid" })) };
  };
  const write = (g) => {
    const out = { points: g.points.map((p) => p.trim()).join(", "), series: g.rows.map((r) => `${r.name.trim()} | ${r.values.map((v) => v.trim()).join(", ")}`).join("\n") };
    g.styles.forEach((st, i) => { out[`c${i + 1}`] = st.c; out[`d${i + 1}`] = st.d; });
    return out;
  };
  const ext = JSON.stringify(write(parse(s)));
  const last = useRef(null);
  const [g, setG] = useState(() => parse(s));
  useEffect(() => { if (ext !== last.current) { setG(parse(s)); last.current = ext; } }, [ext]);
  const commit = (next, extra) => { setG(next); const out = { ...write(next), ...(extra || {}) }; last.current = JSON.stringify(write(parse({ ...s, ...out }))); setMany(out); };
  const [menu, setMenu] = useState(null);
  const ref = useRef(null);
  useOutside(ref, () => setMenu(null), menu !== null);
  const bad = (v) => v.trim() !== "" && !/^-?\d+(\.\d+)?$/.test(v.trim());
  const n = g.points.length;
  const setCell = (i, j, v) => { const rows = g.rows.map((r, k) => (k === i ? { ...r, values: r.values.map((x, m) => (m === j ? v : x)) } : r)); commit({ ...g, rows }); };
  const pasteBlock = (i0, j0) => (e) => {
    const text = (e.clipboardData || window.clipboardData).getData("text");
    if (!/[\t\n]/.test(text)) return;
    e.preventDefault();
    const grid = text.replace(/\r/g, "").split("\n").filter((l) => l.length).map((l) => l.split("\t"));
    const width = Math.max(n, j0 + Math.max(...grid.map((r) => r.length)));
    const rows = g.rows.map((r) => ({ ...r, values: Array.from({ length: width }, (_, j) => r.values[j] || "") }));
    grid.forEach((cells, di) => { const ri = i0 + di; if (ri >= 4) return; if (!rows[ri]) rows[ri] = { name: `Line ${ri + 1}`, values: Array(width).fill("") }; cells.forEach((v, dj) => { rows[ri].values[j0 + dj] = v.trim(); }); });
    commit({ ...g, points: Array.from({ length: width }, (_, j) => g.points[j] || ""), rows });
  };
  const pasteTable = (e) => {
    const text = (e.clipboardData || window.clipboardData).getData("text");
    e.preventDefault();
    const grid = text.replace(/\r/g, "").split("\n").filter((l) => l.trim()).map((l) => l.split(l.includes("\t") ? "\t" : ","));
    if (grid.length < 2) return;
    const head = grid[0].slice(1).map((x) => x.trim());
    const rows = grid.slice(1, 5).map((cells) => ({ name: (cells[0] || "").trim(), values: head.map((_, j) => (cells[j + 1] || "").trim()) }));
    commit({ ...g, points: head, rows });
    e.target.value = "";
  };
  const removePoint = (j) => commit({ ...g, points: g.points.filter((_, m) => m !== j), rows: g.rows.map((r) => ({ ...r, values: r.values.filter((_, m) => m !== j) })) });
  const addPoint = () => commit({ ...g, points: [...g.points, ""], rows: g.rows.map((r) => ({ ...r, values: [...r.values, ""] })) });
  const moveRow = (i, d) => { const j = i + d; if (j < 0 || j >= g.rows.length) return; commit({ ...g, rows: moveItem(g.rows, i, j), styles: moveItem(g.styles, i, j) }); };
  const removeRow = (i) => commit({ ...g, rows: g.rows.filter((_, k) => k !== i), styles: [...g.styles.filter((_, k) => k !== i), { c: "white", d: "solid" }] }, s.focus === g.rows[i].name ? { focus: "none" } : null);
  const anyBad = g.rows.some((r) => r.values.some(bad));
  return html`<div className="field" ref=${ref}>
    <div className="label">Data<span className="val">${g.rows.length} of 4 lines · ${n} points</span></div>
    <div className="grid-wrap"><table className="dg">
      <thead><tr><th></th><th className="dg-corner">Line</th>${g.points.map((p, j) => html`<th key=${j}>
        <input className="dg-head" value=${p} placeholder=${`Point ${j + 1}`} aria-label=${`Point ${j + 1} label`} onChange=${(e) => commit({ ...g, points: g.points.map((x, m) => (m === j ? e.target.value : x)) })} />
        ${n > 2 && html`<button type="button" className="dg-x" aria-label=${`Remove point ${j + 1}`} onClick=${() => removePoint(j)}>×</button>`}</th>`)}
        <th><button type="button" className="dg-add" title="Add a point" aria-label="Add a point" onClick=${addPoint}>+</button></th></tr></thead>
      <tbody>${g.rows.map((r, i) => html`<tr key=${i}>
        <td className="dg-style"><button type="button" className="key-btn" aria-label=${`Line ${i + 1} colour and style`} onClick=${() => setMenu(menu === i ? null : i)}>
          <${LineKey} style=${g.styles[i].d} color=${hex(g.styles[i].c)} u=${0.6} opacity=${1} /></button>
          ${menu === i && html`<div className="pop-menu wide">
            <div className="swatches" role="radiogroup" aria-label="Line colour">${SWATCHES.map((sw) => html`<button key=${sw.id} type="button" role="radio" aria-checked=${g.styles[i].c === sw.id ? "true" : "false"} aria-label=${sw.name} title=${sw.name} className="sw" style=${{ background: sw.hex }}
              onClick=${() => commit({ ...g, styles: g.styles.map((x, k) => (k === i ? { ...x, c: sw.id } : x)) })}></button>`)}</div>
            <div className="seg" role="group" aria-label="Line style" style=${{ marginTop: 8 }}>${[["solid", "Solid"], ["dashed", "Dashed"], ["dotted", "Dotted"]].map(([v, l]) =>
              html`<button key=${v} type="button" aria-pressed=${g.styles[i].d === v ? "true" : "false"} onClick=${() => commit({ ...g, styles: g.styles.map((x, k) => (k === i ? { ...x, d: v } : x)) })}>${l}</button>`)}</div>
            <${MenuItem} onClick=${() => { setMany({ focus: s.focus === r.name ? "none" : r.name }); setMenu(null); }}>${s.focus === r.name ? "Stop focusing this line" : "Make this the focus line"}</${MenuItem}>
            <${MenuItem} disabled=${i === 0} onClick=${() => { moveRow(i, -1); setMenu(null); }}>Move up</${MenuItem}>
            <${MenuItem} disabled=${i === g.rows.length - 1} onClick=${() => { moveRow(i, 1); setMenu(null); }}>Move down</${MenuItem}>
            <${MenuItem} danger disabled=${g.rows.length <= 1} onClick=${() => { removeRow(i); setMenu(null); }}>Remove line</${MenuItem}>
          </div>`}</td>
        <td><input className="dg-name" value=${r.name} placeholder=${`Line ${i + 1}`} aria-label=${`Line ${i + 1} name`} onChange=${(e) => commit({ ...g, rows: g.rows.map((x, k) => (k === i ? { ...x, name: e.target.value } : x)) }, s.focus === r.name ? { focus: e.target.value } : null)} />
          ${s.focus === r.name && r.name && html`<span className="chip-badge">Focus</span>`}</td>
        ${r.values.map((v, j) => html`<td key=${j}><input className=${"dg-cell" + (bad(v) ? " bad" : "")} value=${v} inputMode="decimal" aria-label=${`${r.name || "Line " + (i + 1)}, ${g.points[j] || "point " + (j + 1)}`}
          onChange=${(e) => setCell(i, j, e.target.value)} onPaste=${pasteBlock(i, j)} /></td>`)}
        <td></td></tr>`)}</tbody>
    </table></div>
    ${anyBad && html`<div className="readout warn"><span>Cells outlined in red aren't plain numbers. Leave out units and thousands separators.</span></div>`}
    <div className="row" style=${{ justifyContent: "space-between", flexWrap: "wrap" }}>
      <button type="button" className="link-btn" disabled=${g.rows.length >= 4} onClick=${() => commit({ ...g, rows: [...g.rows, { name: `Line ${g.rows.length + 1}`, values: Array(n).fill("") }] })}>+ Add a line</button>
      <input className="input paste-zone" placeholder="Paste a whole table from Excel or Sheets" aria-label="Paste a table" onPaste=${pasteTable} onChange=${() => {}} value="" />
    </div>
    <div className="hint">For a pasted table, the first row holds the point labels and each row after it is a line: its name, then its numbers.</div>
  </div>`;
}

TEMPLATES.pins.pickAt = (s, x, y, f, w, h, t) => {
  const { pins } = parsePins(s.pins);
  const base = pinsCamera(s, pins, w, h);
  const k = pxPerUnit(base.zoom + (s.push ? 0.22 * (f / Math.max(1, t.total)) : 0));
  return unmerc(base.cx + (x - w / 2) / k, base.cy + (y - h / 2) / k);
};
TEMPLATES.flight.pickAt = (s, x, y, f, w, h, t) => {
  const P = flightPlan(s);
  const fly = makeFlight(w, placeOf(s, "from"), placeOf(s, "to"), Number(s.fromZoom), Number(s.toZoom), Number(s.curve));
  const cam = fly(prog(f, P.flightStart, P.flightF, FLIGHT_EASE));
  const k = pxPerUnit(cam.zoom);
  return unmerc(cam.cx + (x - w / 2) / k, cam.cy + (y - h / 2) / k);
};

const SECTIONS = ["Format", "Content", "Layout", "Style", "Animation"];
function Inspector({ T, s, set, t, setPhase, setMany, startPick }) {
  const ctx = { T, t, setPhase, setMany, startPick };
  const all = [
    ...FORMAT_CONTROLS.map((c) => ({ ...c, section: "Format" })),
    ...T.controls,
    ...TIMING_CONTROLS.map((c) => ({ ...c, section: "Animation" })),
  ];
  return SECTIONS.map((sec) => {
    const cs = all.filter((c) => c.section === sec && (!c.showIf || c.showIf(s)));
    if (!cs.length) return null;
    return html`<details key=${sec} className="section" open>
      <summary>${sec}<${Icon} d=${IC.chevron} size=${14} /></summary>
      <div className="body">
        ${cs.map((c) => html`<${Control} key=${c.key} c=${c} s=${s} set=${set} ctx=${ctx} />`)}
        ${sec === "Animation" && html`<div className=${"readout" + (t.shortened ? " warn" : "")}>
          <span>${t.shortened ? "Hold shortened to keep the clip at 10 s" : "Clip length (max 10 s)"}</span>
          <b>${(t.total / FPS).toFixed(2)} s</b></div>
          <div className="hint" style=${{ gridColumn: "1 / -1" }}>You can also drag the ends of the In, Hold and Out bars under the preview.</div>`}
      </div>
    </details>`;
  });
}

function Presets({ tid, s, presets, setPresets, apply, reset }) {
  const mine = presets.filter((p) => p.templateId === tid);
  const [naming, setNaming] = useState(false);
  const [name, setName] = useState("");
  const [confirmId, setConfirmId] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  useEffect(() => { setNaming(false); setConfirmId(null); setConfirmReset(false); }, [tid]);
  useEffect(() => { if (!confirmId) return; const id = setTimeout(() => setConfirmId(null), 3000); return () => clearTimeout(id); }, [confirmId]);
  useEffect(() => { if (!confirmReset) return; const id = setTimeout(() => setConfirmReset(false), 3000); return () => clearTimeout(id); }, [confirmReset]);
  const onSave = (e) => {
    e.preventDefault();
    const n = (name.trim() || String(TEMPLATES[tid].mainText(s) || TEMPLATES[tid].name).replace(/\*/g, "").replace(/\s+/g, " ").trim()).slice(0, 40);
    setPresets((ps) => [...ps, { id: Date.now().toString(36), templateId: tid, name: n, settings: s }]);
    setName(""); setNaming(false);
  };
  return html`<div>
    <div className="rail-head"><span>Presets</span>
      <button type="button" className=${"btn ghost" + (confirmReset ? " danger-text" : "")} style=${{ height: 24, padding: "0 6px", fontSize: 11.5 }} onClick=${() => { if (confirmReset) { reset(); setConfirmReset(false); } else setConfirmReset(true); }}>
        <${Icon} d=${IC.reset} size=${12} />${confirmReset ? "Click again to reset" : "Reset"}</button>
    </div>
    ${mine.length
      ? html`<div className="preset-list">${mine.map((p) => html`<div key=${p.id} className="preset">
          <button type="button" className="apply" onClick=${() => apply(p)} title=${"Apply " + p.name}>${p.name}</button>
          <button type="button" className=${"del" + (confirmId === p.id ? " confirm" : "")} aria-label=${"Delete " + p.name}
            onClick=${() => { if (confirmId === p.id) { setPresets((ps) => ps.filter((x) => x.id !== p.id)); setConfirmId(null); } else setConfirmId(p.id); }}>${confirmId === p.id ? "Delete" : "×"}</button>
        </div>`)}</div>`
      : html`<div className="empty">Save the current settings to reuse them later. Presets stay in this browser.</div>`}
    ${naming
      ? html`<form className="save-row" onSubmit=${onSave}>
          <input className="input" id="preset-name" autoFocus placeholder="Preset name" maxLength=${40} value=${name} onChange=${(e) => setName(e.target.value)} />
          <button className="btn primary" type="submit">Save</button></form>`
      : html`<button type="button" className="btn" style=${{ marginTop: 8, width: "100%" }} onClick=${() => setNaming(true)}><${Icon} d=${IC.plus} size=${14} />Save as preset</button>`}
  </div>`;
}

const tc = (fr) => { const sec = Math.floor(fr / FPS), ff = fr % FPS; return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(sec % 60).padStart(2, "0")}:${String(ff).padStart(2, "0")}`; };

function Timeline({ t, frame, player, setPhase }) {
  const ref = useRef(null);
  const [drag, setDrag] = useState(null);
  const pct = (fr) => `${(fr / MAX_FRAMES) * 100}%`;
  const frameAt = (x) => { const r = ref.current.getBoundingClientRect(); return Math.round(clamp((x - r.left) / r.width, 0, 1) * MAX_FRAMES); };
  const apply = (kind, x) => {
    const fr = frameAt(x);
    if (kind === "seek") { if (player) { player.pause(); player.seekTo(clamp(fr, 0, t.total - 1)); } }
    else if (kind === "in") setPhase("in", fr);
    else if (kind === "hold") setPhase("hold", fr - t.inF);
    else setPhase("out", fr - t.inF - t.holdF);
  };
  const down = (kind) => (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); e.stopPropagation();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    setDrag(kind);
    if (kind === "seek") apply("seek", e.clientX);
  };
  const move = (e) => { if (!drag) return; e.stopPropagation(); apply(drag, e.clientX); };
  const up = (e) => { if (!drag) return; e.stopPropagation(); setDrag(null); };
  const key = (kind, len) => (e) => {
    const d = e.key === "ArrowLeft" || e.key === "ArrowDown" ? -1 : e.key === "ArrowRight" || e.key === "ArrowUp" ? 1 : 0;
    if (!d) return;
    e.preventDefault(); e.stopPropagation();
    setPhase(kind, len + d * (e.shiftKey ? 5 : 1));
  };
  const segs = [["in", "In", 0, t.inF], ["hold", "Hold", t.inF, t.holdF]];
  if (t.outF > 0) segs.push(["out", "Out", t.inF + t.holdF, t.outF]);
  const fr = Math.min(frame, t.total - 1);
  return html`<div className=${"timeline" + (drag && drag !== "seek" ? " resizing" : "")}>
    <div className="tl-track" ref=${ref} onPointerDown=${down("seek")} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}>
      ${segs.map(([kind, label, start, len]) => html`<div key=${kind} className=${"tl-block " + kind} style=${{ left: pct(start), width: pct(len) }}>${label}<b>${(len / FPS).toFixed(2)}s</b></div>`)}
      <div className="tl-rest" style=${{ left: pct(t.total) }}></div>
      ${segs.map(([kind, label, start, len]) => html`<div key=${"h-" + kind} className=${"tl-handle" + (drag === kind ? " active" : "")} style=${{ left: pct(start + len) }}
        role="slider" tabIndex="0" aria-label=${`${label} length`} aria-valuemin="0" aria-valuemax=${MAX_FRAMES / FPS}
        aria-valuenow=${Number((len / FPS).toFixed(2))} aria-valuetext=${`${(len / FPS).toFixed(2)} seconds`} title=${`Drag to change the ${label.toLowerCase()} length`}
        onPointerDown=${down(kind)} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up} onKeyDown=${key(kind, len)}></div>`)}
      <div className="tl-playhead" style=${{ left: pct(fr) }}></div>
    </div>
    <div className="tl-ticks" aria-hidden="true">${Array.from({ length: 11 }, (_, i) => html`<span key=${i} style=${{ left: `${i * 10}%` }}>${i}${i === 0 ? " s" : ""}</span>`)}</div>
  </div>`;
}

function Transport({ player, t, loop, setLoop, setPhase }) {
  const [frame, setFrame] = useState(0);
  const [playing, setPlaying] = useState(false);
  useEffect(() => {
    if (!player) return;
    const onF = (e) => setFrame(e.detail.frame);
    const onPlay = () => setPlaying(true), onPause = () => setPlaying(false);
    player.addEventListener("frameupdate", onF); player.addEventListener("seeked", onF);
    player.addEventListener("play", onPlay); player.addEventListener("pause", onPause); player.addEventListener("ended", onPause);
    setPlaying(player.isPlaying()); setFrame(player.getCurrentFrame());
    return () => {
      player.removeEventListener("frameupdate", onF); player.removeEventListener("seeked", onF);
      player.removeEventListener("play", onPlay); player.removeEventListener("pause", onPause); player.removeEventListener("ended", onPause);
    };
  }, [player]);
  useEffect(() => {
    const onKey = (e) => {
      if (!player) return;
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (["input", "textarea", "select", "button"].includes(tag) || (e.target && e.target.isContentEditable)) return;
      if (e.code === "Space") { e.preventDefault(); player.toggle(); }
      else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault(); player.pause();
        player.seekTo(Math.max(0, Math.min(t.total - 1, player.getCurrentFrame() + (e.key === "ArrowLeft" ? -1 : 1))));
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [player, t.total]);
  const fr = Math.min(frame, t.total - 1);
  const step = (d) => { if (!player) return; player.pause(); player.seekTo(Math.max(0, Math.min(t.total - 1, player.getCurrentFrame() + d))); };
  return html`<div className="transport">
    <div className="transport-row">
      <button type="button" className="btn primary icon" aria-label=${playing ? "Pause" : "Play"} title="Play / pause (Space)" onClick=${() => player && player.toggle()}><${Icon} d=${playing ? IC.pause : IC.play} size=${15} /></button>
      <span className="tc"><b>${tc(fr)}</b> / ${tc(t.total)}</span>
      <span className="spacer"></span>
      <button type="button" className="btn ghost icon step" aria-label="Previous frame" title="Previous frame (←)" onClick=${() => step(-1)}><${Icon} d=${IC.prev} size=${15} /></button>
      <button type="button" className="btn ghost icon step" aria-label="Next frame" title="Next frame (→)" onClick=${() => step(1)}><${Icon} d=${IC.next} size=${15} /></button>
      <button type="button" className="btn ghost icon" aria-pressed=${loop ? "true" : "false"} aria-label="Loop" title="Loop" onClick=${() => setLoop(!loop)}><${Icon} d=${IC.loop} size=${15} /></button>
    </div>
    <${Timeline} t=${t} frame=${frame} player=${player} setPhase=${setPhase} />
  </div>`;
}

function Stage({ w, h, inputProps, total, previewBg, safe, loop, setPlayer, pick, onPickAt, onPickCancel }) {
  const ref = useRef(null);
  const [box, setBox] = useState({ w: 0, h: 0 });
  useLayoutEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(([e]) => setBox({ w: e.contentRect.width, h: e.contentRect.height }));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  const sc = box.w > 0 && box.h > 0 ? Math.min(box.w / w, box.h / h) : 0;
  const reduced = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  return html`<div className="viewport" ref=${ref}>
    ${sc > 0 && html`<div className=${"frame bg-" + previewBg} style=${{ width: Math.floor(w * sc), height: Math.floor(h * sc) }}>
      <${Player} ref=${setPlayer} component=${Root} inputProps=${inputProps} durationInFrames=${total} fps=${FPS}
        compositionWidth=${w} compositionHeight=${h} style=${{ width: "100%", height: "100%" }}
        loop=${loop} autoPlay=${!reduced} controls=${false} clickToPlay=${false} doubleClickToFullscreen=${false} spaceKeyToPlayOrPause=${false} />
      ${safe && html`<div className="safe" aria-hidden="true"><i style=${{ inset: "5%" }}></i><i style=${{ inset: "10%" }}></i></div>`}
      ${pick && html`<div className="pick-layer" onClick=${(e) => { const r = e.currentTarget.getBoundingClientRect(); onPickAt(((e.clientX - r.left) / r.width) * w, ((e.clientY - r.top) / r.height) * h); }}>
        <div className="pick-hint" onClick=${(e) => e.stopPropagation()}><${Icon} d=${IC.pin} size=${14} /><span>${pick.label}</span><button type="button" className="btn ghost" onClick=${onPickCancel}>Cancel</button></div>
      </div>`}
    </div>`}
  </div>`;
}

/* ------------------------------------------------------------------ desktop app */
/* ProRes .mov needs the installed desktop app: it writes files to disk and runs a small
   Swift helper (compiled once with Xcode's swiftc) that uses macOS's own ProRes encoder. */

const desktopReady = (async () => {
  try { return window.claude && window.claude.use ? await window.claude.use("desktop") : null; } catch { return null; }
})();
desktopReady.then((d) => { if (d && d.fs && d.app && d.app.dock) d.app.dock.setIcon(drawAppIcon()).catch(() => {}); });

function drawAppIcon() {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const x = c.getContext("2d");
  x.fillStyle = "#1a2e1e"; x.beginPath(); x.roundRect(8, 8, 240, 240, 56); x.fill();
  x.fillStyle = "#ec006c"; x.fillRect(52, 62, 20, 20);
  x.fillStyle = "#e8f0e0"; x.fillRect(84, 66, 80, 12);
  x.fillStyle = "#ffffff"; x.fillRect(52, 106, 152, 38);
  x.fillStyle = "#ec006c"; x.fillRect(52, 156, 98, 38);
  return c.toDataURL("image/png");
}

function useDesktop() {
  const [st, setSt] = useState({ api: null, app: false, install: "unknown", access: "unknown" });
  /* access: the app's full-access permission ("granted", "prompt", "denied" or "unavailable", which is also what an
     organisation that doesn't allow it reads as). Checked on load and whenever the window regains focus. */
  const check = useCallback(async () => {
    const d = await desktopReady;
    if (d && d.fs) {
      let access = "unavailable";
      try { access = await d.permissions.state("full-access"); } catch {}
      setSt({ api: d, app: true, install: "installed", access });
      return;
    }
    let install = "unavailable";
    try { if (d && d.install) install = await d.install.state(); } catch {}
    setSt({ api: d, app: false, install, access: "none" });
  }, []);
  useEffect(() => {
    check();
    window.addEventListener("focus", check);
    return () => window.removeEventListener("focus", check);
  }, []);
  return { ...st, recheck: check, markBlocked: () => setSt((x) => ({ ...x, access: "unavailable" })) };
}

function runProcess(d, cmd, args, onLine, signal) {
  return new Promise((resolve) => {
    let stderr = "", buf = "", settled = false;
    const finish = (v) => { if (!settled) { settled = true; resolve(v); } };
    let p;
    try { p = d.childProcess.spawn(cmd, args); } catch (e) { finish({ code: -1, stderr: String((e && e.message) || e) }); return; }
    if (signal) signal.addEventListener("abort", () => { p.kill().catch(() => {}); }, { once: true });
    p.stdout.on("data", (chunk) => { buf += chunk; const lines = buf.split("\n"); buf = lines.pop(); if (onLine) lines.forEach(onLine); });
    p.stderr.on("data", (chunk) => { stderr += chunk; });
    p.on("error", (e) => finish({ code: -1, stderr: stderr + String((e && e.message) || e) }));
    p.on("close", (code) => finish({ code, stderr }));
  });
}

const MOVWRITER_VERSION = 1;
async function ensureMovWriter(d, appDir, setStage) {
  const bin = `${appDir}/bin/movwriter-${MOVWRITER_VERSION}`;
  if (await d.fs.exists(bin)) return bin;
  setStage("Setting up the ProRes encoder (first export only)…");
  await d.fs.mkdir(`${appDir}/bin`, { recursive: true });
  const src = `${bin}.swift`;
  await d.fs.writeFile(src, document.getElementById("movwriter-src").textContent, "utf8");
  const r = await runProcess(d, "/usr/bin/xcrun", ["swiftc", "-O", "-suppress-warnings", "-o", bin, src]);
  if (r.code !== 0 || !(await d.fs.exists(bin))) {
    const err = new Error((r.stderr || "").trim().split("\n").slice(-2).join(" ") || "swiftc failed");
    err.code = "NO_SWIFT";
    throw err;
  }
  return bin;
}

async function uniquePath(d, dir, stem, ext) {
  let p = `${dir}/${stem}.${ext}`;
  for (let i = 2; await d.fs.exists(p); i++) p = `${dir}/${stem}-${i}.${ext}`;
  return p;
}
const mb = (bytes) => `${(bytes / 1048576).toFixed(1)} MB`;

function ExportPanel({ tid, s, t, w, h, player, desktop }) {
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState(0);
  const [stage, setStage] = useState("");
  const [msg, setMsg] = useState(null);
  const abortRef = useRef(null);
  const inApp = desktop.app;
  /* The .mov needs the installed app with full access (it saves to disk and runs macOS's ProRes encoder). */
  const movReady = inApp && (desktop.access === "granted" || desktop.access === "prompt");

  const run = async (fmt) => {
    setBusy(true); setProgress(0); setMsg(null); setStage("Loading renderer…");
    const ac = new AbortController(); abortRef.current = ac;
    const d = desktop.api;
    const useFs = movReady;
    const stem = `${tid}-${slug(TEMPLATES[tid].mainText(s))}-${s.ratio.replace(":", "x")}`;
    try {
      const wr = await import(WEB_RENDERER);
      const composition = { component: Root, durationInFrames: t.total, fps: FPS, width: w, height: h, id: "overlay" };
      const inputProps = { templateId: tid, settings: s };
      let blob = null, filename = null, savedPath = null, outDir = null, home = null;
      if (useFs) {
        home = await d.os.homedir();
        outDir = `${home}/Movies/Overlay Studio`;
        await d.fs.mkdir(outDir, { recursive: true });
      }

      if (fmt === "movweb") {
        setStage("Loading the encoder…");
        const ff = await getFFmpeg();
        const names = [];
        try {
          setStage("Rendering…");
          const BATCH = 10;
          for (let i = 0; i < t.total; i += BATCH) {
            if (ac.signal.aborted) throw new DOMException("Aborted", "AbortError");
            const frames = [];
            for (let j = i; j < Math.min(t.total, i + BATCH); j++) frames.push(j);
            const results = await wr.renderFramesOnWeb({ composition, inputProps, frames, signal: ac.signal });
            for (let k = 0; k < results.length; k++) {
              const name = `f_${String(frames[k]).padStart(4, "0")}.png`;
              await ff.writeFile(name, new Uint8Array(await (await results[k].blob({ format: "png" })).arrayBuffer()));
              names.push(name);
            }
            setProgress(((i + frames.length) / t.total) * 0.5);
          }
          if (ac.signal.aborted) throw new DOMException("Aborted", "AbortError");
          setStage("Encoding ProRes 4444…");
          const onProg = ({ progress: p }) => setProgress(0.5 + 0.4 * clamp(p || 0, 0, 1));
          ff.on("progress", onProg);
          const abort = () => ff.terminate();
          ac.signal.addEventListener("abort", abort, { once: true });
          try {
            const code = await ff.exec(["-framerate", String(FPS), "-i", "f_%04d.png",
              "-vf", "scale=out_color_matrix=bt709:out_range=tv", "-c:v", "prores_ks", "-profile:v", "4", "-pix_fmt", "yuva444p10le",
              "-alpha_bits", "16", "-vendor", "apl0", "-colorspace", "bt709", "-color_primaries", "bt709", "-color_trc", "bt709", "-y", "out.mov"]);
            if (code !== 0) throw new Error("The encoder stopped (code " + code + ").");
          } finally {
            ff.off("progress", onProg);
            ac.signal.removeEventListener("abort", abort);
          }
          const data = await ff.readFile("out.mov");
          setStage("Finishing…");
          const mov = await appleProRes(data, (k, n) => setProgress(0.9 + (0.1 * k) / n));
          blob = new Blob([mov], { type: "video/quicktime" });
          filename = `${stem}-prores4444.mov`;
          await ff.deleteFile("out.mov").catch(() => {});
        } finally {
          if (ac.signal.aborted) ffmpegPromise = null;
          else for (const n of names) await ff.deleteFile(n).catch(() => {});
        }
      } else if (fmt === "mov") {
        if ((await d.os.platform()) !== "darwin") { const err = new Error("ProRes export needs a Mac."); err.code = "NOT_MAC"; throw err; }
        const appDir = `${home}/Library/Application Support/Overlay Studio`;
        const bin = await ensureMovWriter(d, appDir, setStage);
        const tmp = `${appDir}/tmp/${Date.now().toString(36)}`;
        await d.fs.mkdir(tmp, { recursive: true });
        try {
          setStage("Rendering…");
          const BATCH = 10;
          for (let i = 0; i < t.total; i += BATCH) {
            if (ac.signal.aborted) throw new DOMException("Aborted", "AbortError");
            const frames = [];
            for (let j = i; j < Math.min(t.total, i + BATCH); j++) frames.push(j);
            const results = await wr.renderFramesOnWeb({ composition, inputProps, frames, signal: ac.signal });
            for (let k = 0; k < results.length; k++) {
              const b = await results[k].blob({ format: "png" });
              await d.fs.writeFile(`${tmp}/f_${String(frames[k]).padStart(4, "0")}.png`, new Uint8Array(await b.arrayBuffer()));
            }
            setProgress(((i + frames.length) / t.total) * 0.6);
          }
          setStage("Encoding ProRes 4444…");
          const outPath = await uniquePath(d, outDir, `${stem}-prores4444`, "mov");
          const r = await runProcess(d, bin, [tmp, outPath, String(FPS), String(w), String(h)], (line) => {
            const m = /^frame (\d+)\/(\d+)/.exec(line);
            if (m) setProgress(0.6 + (0.4 * Number(m[1])) / Number(m[2]));
          }, ac.signal);
          if (ac.signal.aborted) throw new DOMException("Aborted", "AbortError");
          if (r.code !== 0) throw new Error((r.stderr || "").trim().split("\n").pop() || "The encoder stopped.");
          savedPath = outPath;
        } finally {
          d.fs.rm(tmp, { recursive: true, force: true }).catch(() => {});
        }
      } else {
        setStage("Rendering…");
        const r = await wr.renderMediaOnWeb({
          composition, inputProps, signal: ac.signal,
          container: "webm", videoCodec: "vp9",
          transparent: s.background === "transparent",
          videoBitrate: "very-high", muted: true,
          onProgress: (p) => setProgress(p.progress),
        });
        blob = await r.getBlob();
        filename = `${stem}-25fps.webm`;
      }

      if (!savedPath) {
        if (useFs) {
          const dot = filename.lastIndexOf(".");
          savedPath = await uniquePath(d, outDir, filename.slice(0, dot), filename.slice(dot + 1));
          await d.fs.writeFile(savedPath, new Uint8Array(await blob.arrayBuffer()));
        } else {
          setStage("Saving…");
          const res = await saveFile(filename, blob);
          setMsg(res.ok ? { ok: true, text: `${HOSTED ? "Downloaded" : "Saved"} ${filename} (${mb(blob.size)})` } : { ok: false, text: SAVE_ERRORS[res.code] || SAVE_ERRORS.unavailable });
          return;
        }
      }
      let size = "";
      try { size = ` (${mb((await d.fs.stat(savedPath)).size)})`; } catch {}
      setMsg({ ok: true, text: `Saved to Movies › Overlay Studio › ${savedPath.split("/").pop()}${size}`, path: savedPath });
    } catch (e) {
      const text = (e && e.message) || String(e);
      if (ac.signal.aborted || (e && e.name === "AbortError")) setMsg({ ok: false, text: "Export cancelled." });
      else if (text.startsWith("ENOSYS")) { desktop.markBlocked(); setMsg(null); }
      else if (e && e.code === "NO_SWIFT") setMsg({ ok: false, text: "The ProRes encoder needs Apple's developer tools. Open Terminal, run xcode-select --install, then export again." });
      else if (text.startsWith("EPERM")) setMsg({ ok: false, text: "Overlay Studio isn't allowed to save files or run its encoder. Turn full access back on in the app's permissions.", action: "permissions" });
      else { console.error(e); setMsg({ ok: false, text: "Export failed: " + text.slice(0, 180) }); }
    } finally {
      setBusy(false); setStage(""); abortRef.current = null;
    }
  };

  const install = async () => {
    try {
      const r = await desktop.api.install.request();
      if (r === "installed") setMsg({ ok: true, text: "Installing Overlay Studio. Open it from the Dock or Applications to export .mov files." });
      else if (r !== "cancelled") setMsg({ ok: false, text: "The app couldn't be installed from here. Use Install as app in this artifact's menu in the Claude desktop app." });
    } catch {
      setMsg({ ok: false, text: "The app couldn't be installed from here. Use Install as app in this artifact's menu in the Claude desktop app." });
    }
  };

  const secs = (t.total / FPS).toFixed(1);
  const smallBtn = { height: 26, padding: "0 10px", fontSize: 12 };
  let main = null, status = null;
  if (busy) {
    main = html`<div style=${{ display: "flex", flexDirection: "column", gap: 8 }}>
      <div className="row" style=${{ justifyContent: "space-between" }}><span className="msg">${stage} ${Math.round(progress * 100)}%</span>
        <button type="button" className="btn ghost" style=${{ height: 26 }} onClick=${() => abortRef.current && abortRef.current.abort()}>Cancel</button></div>
      <div className="progress"><i style=${{ "--p": `${Math.round(progress * 100)}%` }}></i></div></div>`;
  } else if (HOSTED) {
    main = html`<button type="button" className="btn primary block" onClick=${() => run("movweb")}><${Icon} d=${IC.download} size=${15} />Export transparent .mov · ${secs} s</button>`;
    status = html`<div className="hint">ProRes 4444 with transparency, for Premiere and CapCut. Made in your browser; the first export loads the encoder (about 30 MB).</div>`;
  } else if (movReady) {
    main = html`<button type="button" className="btn primary block" onClick=${() => run("mov")}><${Icon} d=${IC.download} size=${15} />Export transparent .mov · ${secs} s</button>`;
    status = html`<div className="hint">ProRes 4444 with transparency, for Premiere and CapCut. Saved to Movies › Overlay Studio.</div>`;
  } else {
    main = html`<a className="btn primary block" href=${WEB_URL} target="_blank" rel="noopener" style=${{ textDecoration: "none" }}><${Icon} d=${IC.download} size=${15} />Export .mov in the web version</a>`;
    status = html`<div className="hint">Transparent .mov files are made by the same app as a normal web page, at ${WEB_URL.replace("https://", "").replace(/\/$/, "")}. Settings and presets don't carry over.</div>`;
  }

  return html`<div className="export">
    <div className="rail-head" style=${{ marginBottom: 0 }}><span>Export</span><span style=${{ textTransform: "none", letterSpacing: 0, fontWeight: 500 }}>${w} × ${h} · 25 fps</span></div>
    ${main}
    ${status}
    ${msg && html`<div className=${"msg " + (msg.ok ? "ok" : "err")} role="status">${msg.text}
      ${msg.path && html` <button type="button" className="btn ghost" style=${{ height: 22, padding: "0 6px", fontSize: 12 }} onClick=${() => desktop.api.shell.showItemInFolder(msg.path).catch(() => {})}>Show in Finder</button>`}
      ${msg.action === "permissions" && html` <button type="button" className="btn ghost" style=${{ height: 22, padding: "0 6px", fontSize: 12 }} onClick=${() => desktop.api.permissions.manage().then(desktop.recheck).catch(() => {})}>Open permissions</button>`}
    </div>`}
    <details className="more-formats">
      <summary>Other formats</summary>
      <div className="hint">Transparent WebM${HOSTED ? "" : ", saved as a download"}. Premiere can't read its transparency, and CapCut's support is unconfirmed.</div>
      <button type="button" className="btn block" disabled=${busy} onClick=${() => run("webm")}>Export WebM · ${secs} s</button>
    </details>
  </div>`;
}

/* ------------------------------------------------------------------ app */

function App() {
  const saved = useMemo(() => readJSON(KEY_STATE, {}), []);
  const [tid, setTid] = useState(TEMPLATES[saved.templateId] ? saved.templateId : "title");
  const [all, setAll] = useState(saved.settings && typeof saved.settings === "object" ? saved.settings : {});
  const [presets, setPresets] = useState(() => { const p = readJSON(KEY_PRESETS, []); return Array.isArray(p) ? p : []; });
  const [previewBg, setPreviewBg] = useState(["dark", "light"].includes(saved.previewBg) ? saved.previewBg : "dark");
  const [safe, setSafe] = useState(false);
  const [loop, setLoop] = useState(true);
  const [player, setPlayer] = useState(null);
  const fonts = useFontStatus();
  const desktop = useDesktop();

  const T = TEMPLATES[tid];
  const s = useMemo(() => settingsFor(tid, all[tid]), [tid, all]);
  const t = useMemo(() => timing(T, s), [T, s]);
  const [w, h] = RATIOS[s.ratio] || RATIOS["16:9"];
  const set = useCallback((k, v) => setAll((a) => ({ ...a, [tid]: { ...(a[tid] || {}), [k]: v } })), [tid]);
  const setMany = useCallback((patch) => setAll((a) => ({ ...a, [tid]: { ...(a[tid] || {}), ...patch } })), [tid]);
  /* One phase length in frames, from a timeline handle or the In slider. Later phases move along; the clip stays within 10 s. */
  const setPhase = (kind, frames) => {
    if (kind === "in") {
      const [mn, mx] = inRange(T, s);
      setMany(solveIn(T, s, clamp(frames, mn, Math.max(mn, Math.min(mx, MAX_FRAMES - t.outF - 5)))));
    } else if (kind === "hold") {
      setMany({ hold: clamp(frames, 5, Math.max(5, Math.min(8 * FPS, MAX_FRAMES - t.inF - t.outF))) / FPS });
    } else if (kind === "out") {
      setMany({ outSec: clamp(frames, 5, Math.max(5, Math.min(2 * FPS, MAX_FRAMES - t.inF - t.holdF))) / FPS });
    }
  };
  const inputProps = useMemo(() => ({ templateId: tid, settings: s }), [tid, s]);

  useEffect(() => { const id = setTimeout(() => writeJSON(KEY_STATE, { templateId: tid, settings: all, previewBg }), 250); return () => clearTimeout(id); }, [tid, all, previewBg]);
  useEffect(() => { writeJSON(KEY_PRESETS, presets); }, [presets]);
  useEffect(() => { if (player) player.seekTo(0); }, [tid]);
  /* Pick on the map: the next click on the preview becomes a place (map templates only). */
  const [pick, setPick] = useState(null);
  const startPick = useCallback((label, apply) => { if (player) player.pause(); setPick({ label, apply }); }, [player]);
  useEffect(() => { setPick(null); }, [tid]);
  useEffect(() => {
    if (!pick) return;
    const onKey = (e) => { if (e.key === "Escape") setPick(null); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [pick]);
  const onPickAt = (x, y) => {
    if (!pick || !T.pickAt) { setPick(null); return; }
    const ll = T.pickAt(s, x, y, player ? player.getCurrentFrame() : 0, w, h, t);
    pick.apply(Math.round(ll.lat * 10000) / 10000, Math.round(ll.lng * 10000) / 10000);
    setPick(null);
  };

  const fontsOk = fonts && fonts.serif && fonts.sans;
  const missing = fonts ? [!fonts.serif && "P22 Mackinac Pro", !fonts.sans && "Helvetica Neue"].filter(Boolean) : [];

  return html`<div className="shell">
    <header className="top">
      <div className="brand"><span className="brand-mark" aria-hidden="true"></span>Overlay Studio</div>
      <span className="crumb">/ ${T.name}</span>
      <span className="spacer"></span>
      ${fonts && html`<span className=${"chip " + (fontsOk ? "ok" : "warn")} title=${fontsOk ? "P22 Mackinac Pro and Helvetica Neue are installed on this computer" : "Missing: " + missing.join(", ")}>
        <span className="dot"></span>${fontsOk ? "Brand fonts ready" : `${missing.join(" and ")} missing`}</span>`}
    </header>

    <aside className="left" aria-label="Templates and presets">
      <div>
        <div className="rail-head"><span>Templates</span></div>
        ${TEMPLATE_GROUPS.map(([group, ids]) => html`<div key=${group} className="tpl-group"><div className="tpl-group-head">${group}</div>
        <div className="tpl-list">${ids.map((id) => { const X = TEMPLATES[id]; return html`<button key=${id} type="button" className="tpl" aria-current=${tid === id ? "true" : "false"} onClick=${() => setTid(id)}>
          <span className="thumb" dangerouslySetInnerHTML=${{ __html: X.thumb }}></span>
          <span><span className="name">${X.name}</span><br /><span className="desc">${X.desc}</span></span></button>`; })}</div></div>`)}
      </div>
      <${Presets} tid=${tid} s=${s} presets=${presets} setPresets=${setPresets}
        apply=${(p) => setAll((a) => ({ ...a, [tid]: { ...p.settings } }))}
        reset=${() => setAll((a) => ({ ...a, [tid]: {} }))} />
      ${fonts && !fontsOk && html`<div className="note warn"><b>${missing.join(" and ")} not found.</b> Previews and exports use the fonts installed on this computer. Activate P22 Mackinac Pro in the Creative Cloud app under Fonts, then reload this page.</div>`}
      <div className="note">Edit any field on the right and the preview updates straight away. <b>Space</b> plays and pauses, <b>← →</b> step one frame.</div>
    </aside>

    <main className="stage">
      <div className="stage-bar">
        <div className="stage-title"><strong>${T.name}</strong><span>${w} × ${h} · 25 fps · ${(t.total / FPS).toFixed(1)} s</span></div>
        <div className="stage-tools">
          <div className="seg small" role="group" aria-label="Preview background">${[["dark", "Dark"], ["light", "Light"]].map(([id, lab]) =>
            html`<button key=${id} type="button" aria-pressed=${previewBg === id ? "true" : "false"} onClick=${() => setPreviewBg(id)}>${lab}</button>`)}</div>
          <button type="button" className="btn icon" aria-pressed=${safe ? "true" : "false"} aria-label="Safe area guides" title="Safe area guides (5% and 10%)" onClick=${() => setSafe(!safe)}><${Icon} d=${IC.safe} size=${15} /></button>
        </div>
      </div>
      <${Stage} w=${w} h=${h} inputProps=${inputProps} total=${t.total} previewBg=${previewBg} safe=${safe} loop=${loop} setPlayer=${setPlayer} pick=${pick} onPickAt=${onPickAt} onPickCancel=${() => setPick(null)} />
      <${Transport} player=${player} t=${t} loop=${loop} setLoop=${setLoop} setPhase=${setPhase} />
    </main>

    <aside className="right" aria-label="Settings">
      <div className="scroll"><${Inspector} key=${tid} T=${T} s=${s} set=${set} t=${t} setPhase=${setPhase} setMany=${setMany} startPick=${startPick} /></div>
      <${ExportPanel} tid=${tid} s=${s} t=${t} w=${w} h=${h} player=${player} desktop=${desktop} />
    </aside>
  </div>`;
}

createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>

</body>
</html>
